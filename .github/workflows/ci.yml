name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t hs-reporter:ci .
      - name: Smoke test
        run: |
          docker run -d --name hsr -p 8080:8080 hs-reporter:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/api/health && exit 0
            sleep 1
          done
          docker logs hsr
          exit 1
