async function renderPlan(id) {
  if (!PCAT) PCAT = await api("/api/plan-catalog");
  let P = await api(`/api/plans/${id}`);
  const shares = await api("/api/shares");
  let result = P.has_result ? await api(`/api/plans/${id}/result`).catch(() => null) : null;
  let saveTimer = null, pending = {};

  view.innerHTML = `
  <header class="page"><div><h1 id="pl-title"></h1><p class="sub" id="pl-sub"></p></div>
    <div class="row"><a class="btn" href="#/plans">All plans</a></div></header>
  <div class="stack steps">
    <section class="panel" id="s1"></section>
    <section class="panel" id="s2"></section>
    <section class="panel" id="s3"></section>
    <section class="panel" id="s4"></section>
    <section class="panel" id="s5"></section>
    <div class="calc-bar"><button class="primary" id="pl-calc">Calculate space</button>
      <span class="hint">Models placement for every scanned file with the objectives and assumptions above.</span></div>
    <section class="panel" id="s6"></section>
  </div>`;

  const head = () => {
    $("#pl-title").textContent = P.name;
    $("#pl-sub").innerHTML = `${esc(P.share_name || "No share")} <span class="mono">${esc(P.root)}</span>`;
  };
  function save(patch, redraw = []) {
    Object.assign(pending, patch); Object.assign(P, patch);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const body = pending; pending = {};
      try {
        const np = await api(`/api/plans/${id}`, {method: "PUT", body});
        // The rows on screen are being edited: keep those objects; take everything else from the server.
        P = {...np, ...pending, rows: P.rows};
        drawChecks(); drawFieldsNotice();
        redraw.forEach(f => f());
      } catch (e) { toast(e.message, true); }
    }, 450);
  }

  // ---- 1. share and folder
  function draw1() {
    $("#s1").innerHTML = `<h2><span class="n">1</span>Share and folder</h2>
      <div class="grid2"><div><label class="f" for="p-name">Plan name</label><input type="text" id="p-name" value="${esc(P.name)}"></div>
        <div><label class="f" for="p-cshare">Share name on the cluster</label><input type="text" id="p-cshare" class="mono" value="${esc(P.cluster_share || "")}">
          <div class="hint">Used in the generated share-objective-add commands.</div></div></div>
      <div class="grid2" style="margin-top:12px"><div><label class="f" for="p-share">Share</label><select id="p-share">${shares.map(s => `<option value="${s.id}" ${s.id === P.share_id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>
        <div><label class="f" for="p-root">Folder to model</label><div class="row" style="flex-wrap:nowrap"><input type="text" id="p-root" class="mono" value="${esc(P.root)}"><button type="button" id="p-browse">Browse…</button></div>
          <div class="hint">Objective scopes and conditions are tested against everything below this folder. Changing it needs a new scan.</div></div></div>`;
    $("#p-name").oninput = e => { save({name: e.target.value}); head(); };
    $("#p-cshare").oninput = e => save({cluster_share: e.target.value});
    $("#p-share").onchange = e => { save({share_id: e.target.value}); };
    $("#p-root").onchange = e => save({root: e.target.value});
    $("#p-browse").onclick = () => browseDialog($("#p-share").value, p => { $("#p-root").value = p; save({root: p}); });
  }

  // ---- 2. fields and scan
  const KIND_GROUPS = [["bytes", "Sizes"], ["age", "Ages"], ["time", "Times"], ["typed:USER", "Ownership"], ["bool", "Flags"], ["text", "Names and paths"], ["labels", "Labels"]];
  const kindGroup = k => k.startsWith("typed:") ? (k === "typed:USER" || k === "typed:GROUP" ? "typed:USER" : "text") : k;
  function draw2() {
    const sel = P.fields || [], metas = P.metas || [];
    const scan = P.scan || {};
    const avail = Object.entries(PCAT.fields).filter(([f]) => !sel.includes(f) && !PCAT.required.includes(f) && !PCAT.walk_fields.includes(f));
    const changed = scan.fields && JSON.stringify([...PCAT.required, ...sel.filter(f => !PCAT.required.includes(f)), ...metas].filter(f => !PCAT.walk_fields.includes(f))) !== JSON.stringify(scan.fields);
    $("#s2").innerHTML = `<h2><span class="n">2</span>Fields to gather, and scan</h2>
      <p class="hint" style="margin-top:-6px">The scan walks the folder (names, paths and folders come from the walk) and asks hs only for these fields. Pick the ones your conditions use.</p>
      <div class="chips" style="margin:8px 0">
        ${PCAT.required.map(f => `<span class="chip" title="Always gathered: needed for the space calculation">${f}</span>`).join("")}
        ${["NAME", "PATH", "IS_FILE"].map(f => `<span class="chip" style="background:#F0F2F5;border-color:var(--rule)" title="From the folder walk">${f}</span>`).join("")}
        ${sel.filter(f => !PCAT.required.includes(f)).map(f => `<span class="chip">${f}<button aria-label="Remove ${f}" data-rmf="${f}">×</button></span>`).join("")}
        ${metas.map(m => `<span class="chip">${esc(m)}<button aria-label="Remove ${esc(m)}" data-rmm="${esc(m)}">×</button></span>`).join("")}
      </div>
      <div id="fields-notice"></div>
      <div class="row" style="align-items:flex-end">
        <div><label class="f" for="add-field">Add a field</label><select id="add-field" style="width:260px"><option value="">Choose…</option>
          ${KIND_GROUPS.map(([k, l]) => { const opts = avail.filter(([, v]) => kindGroup(v.kind) === k); return opts.length ? `<optgroup label="${l}">${opts.map(([f, v]) => `<option value="${f}">${f} · ${esc(v.label)}</option>`).join("")}</optgroup>` : ""; }).join("")}</select></div>
        <div><label class="f" for="meta-fn">Tag, label, keyword or attribute</label><div class="row" style="flex-wrap:nowrap;gap:6px">
          <select id="meta-fn" style="width:170px">${PCAT.meta_funcs.map(f => `<option>${f}</option>`).join("")}</select>
          <input type="text" id="meta-name" placeholder="name" style="width:150px"><button type="button" id="meta-add">Add</button></div></div>
        <span class="spacer"></span>
        <button class="primary" id="scan-btn" ${scan.status === "running" ? "disabled" : ""}>${scan.status === "running" ? "Scanning…" : scan.status ? "Scan again" : "Scan"}</button>
      </div>
      <p class="hint" style="margin:8px 0 0">${crawlNote(PCAT.crawl)}</p>
      <div style="margin-top:6px">${scanStatus(scan, changed)}</div>`;
    $$("[data-rmf]").forEach(b => b.onclick = () => { save({fields: (P.fields || []).filter(f => f !== b.dataset.rmf)}); draw2(); });
    $$("[data-rmm]").forEach(b => b.onclick = () => { save({metas: (P.metas || []).filter(m => m !== b.dataset.rmm)}); draw2(); });
    $("#add-field").onchange = e => { if (!e.target.value) return; save({fields: [...(P.fields || []), e.target.value]}); draw2(); };
    $("#meta-add").onclick = () => { const n = $("#meta-name").value.trim(); if (!n) return;
      save({metas: [...(P.metas || []), `${$("#meta-fn").value}("${n.replace(/"/g, "")}")`]}); draw2(); };
    $("#scan-btn").onclick = async () => {
      clearTimeout(saveTimer); if (Object.keys(pending).length) { await api(`/api/plans/${id}`, {method: "PUT", body: pending}); pending = {}; }
      await act(() => api(`/api/plans/${id}/scan`, {method: "POST"})); poll();
    };
    drawFieldsNotice();
  }
  function scanStatus(s, changed) {
    if (!s.status) return `<p class="hint" style="margin:0">Not scanned yet.</p>`;
    if (s.status === "running") return `<p class="status-line">${statusPill("running")} ${s.phase === "walking" || s.phase === "starting" ? `Walking folders${s.found ? ` (${num(s.found)} entries so far)` : ""}…` : `Gathering metadata: ${num(s.done || 0)} of ${num(s.files || 0)} files…`}</p>`;
    if (s.status === "failed") return `<div class="errbox">${esc(s.error || "Scan failed")}</div>`;
    return `<p class="status-line">${statusPill(s.status)} ${num(s.files)} files in ${num(s.folders)} folders, ${bytes(s.bytes)} · scanned ${when(s.finished)} · ${esc(s.method || "")}
      ${s.status === "partial" ? ` · <b>${num(s.files - s.gathered)} files had no metadata</b>` : ""}
      ${changed ? ` · <b style="color:#8A6400">Fields changed since this scan; scan again to use them.</b>` : ""}</p>
      ${s.truncated ? `<p class="hint">Stopped at HSR_PLAN_MAX_FILES entries.</p>` : ""}
      ${(s.error_samples || []).length ? `<details><summary class="hint">hs messages</summary><pre class="raw">${esc(s.error_samples.join("\n\n"))}</pre></details>` : ""}`;
  }
  function drawFieldsNotice() {
    const el = $("#fields-notice"); if (!el) return;
    const need = P.needed || {fields: [], metas: []};
    const missF = need.fields.filter(f => !(P.fields || []).includes(f) && !PCAT.required.includes(f));
    const missM = need.metas.filter(m => !(P.metas || []).includes(m));
    el.innerHTML = missF.length || missM.length ? `<div class="wlist"><li class="warn" style="list-style:none">Your conditions use ${[...missF, ...missM].map(esc).join(", ")}, which ${missF.length + missM.length > 1 ? "aren't" : "isn't"} selected.
      <button class="ghost" id="add-needed">Add ${missF.length + missM.length > 1 ? "them" : "it"}</button></li></div>` : "";
    $("#add-needed") && ($("#add-needed").onclick = () => { save({fields: [...(P.fields || []), ...missF], metas: [...(P.metas || []), ...missM]}); setTimeout(draw2, 50); });
  }
  let pollTimer2 = null;
  async function poll() {
    clearTimeout(pollTimer2);
    if (!location.hash.startsWith(`#/plan/${id}`)) return;
    P = await api(`/api/plans/${id}`);
    draw2();
    if (P.scan && P.scan.status === "running") pollTimer2 = setTimeout(poll, 1500);
    else { drawChecks(); refreshAllChecks(); }
  }

  // ---- 3. cluster information
  const UPLOADS = [["volumes", "volume-list --full", "Storage volumes"], ["object_volumes", "object-volume-list --full", "Object volumes"],
    ["volume_groups", "volume-group-list --full", "Volume groups"], ["objectives", "objective-list --full", "Objectives"]];
  function draw3() {
    const c = P.cluster || {}, up = c.uploaded || {};
    const vols = [...(c.volumes || []), ...(c.object_volumes || [])];
    $("#s3").innerHTML = `<h2><span class="n">3</span>Cluster information</h2>
      <p class="hint" style="margin-top:-6px">Upload or paste the output of these Hammerspace CLI commands. The kind is detected from the contents.</p>
      <div class="upl">${UPLOADS.map(([k, cmd, label]) => `<div class="card ${c[k] ? "ok" : ""}"><b>${label}</b><div><code>${cmd}</code></div>
        <div class="status-line">${c[k] ? `${c[k].length} loaded · ${when(up[k])}` : "Not loaded"}</div>
        <div class="row" style="margin-top:6px;gap:6px"><label class="btn" style="min-height:28px;padding:3px 10px">Upload file<input type="file" data-up="${k}" hidden accept=".txt,text/plain"></label>
          <button style="min-height:28px;padding:3px 10px" data-paste="${k}">Paste</button>${c[k] ? `<button class="ghost danger" style="min-height:28px" data-clear="${k}">Clear</button>` : ""}</div></div>`).join("")}</div>
      ${vols.length ? `<h3 style="margin-top:14px">Volumes</h3><div class="scroll"><table class="data"><thead><tr><th>Volume</th><th>Type</th><th>Storage system</th><th>Access</th><th class="num">Free</th><th class="num">Total</th><th class="num">Availability</th><th class="num">Durability</th><th>Online delay</th><th>Groups</th></tr></thead><tbody>
        ${vols.map(v => `<tr class="${v.read_only ? "muted" : ""}"><td><b>${esc(v.name)}</b></td><td>${v.kind === "object" ? "Object" : "Storage"}</td><td>${esc(v.node)}</td>
          <td>${v.read_only ? `<span class="pill warn">Read-only</span>` : esc(v.access)}</td><td class="num">${v.free == null ? "Unlimited" : bytes(v.free)}</td><td class="num">${v.total == null ? "Unlimited" : bytes(v.total)}</td>
          <td class="num">${pct(v.availability)}</td><td class="num">${pct(v.durability)}</td><td>${v.online_delay === 0 ? "Online" : v.online_delay == null ? "—" : Math.round(v.online_delay / 60) + " min"}</td>
          <td class="hint">${(v.groups || []).map(esc).join(", ")}</td></tr>`).join("")}</tbody></table></div>` : ""}
      ${(c.volume_groups || []).length ? `<details style="margin-top:10px"><summary class="hint">Volume groups (${c.volume_groups.length})</summary><ul class="msgs">${c.volume_groups.map(g => `<li><b>${esc(g.name)}</b>: ${g.volumes.length ? g.volumes.map(esc).join(", ") : `<span class="hint">no volumes</span>`}</li>`).join("")}</ul></details>` : ""}`;
    const upload = async (text, slot) => {
      const r = await act(() => api(`/api/plans/${id}/cluster`, {method: "POST", body: {text}}));
      P = r.plan; toast(`Loaded ${r.count} ${UPLOADS.find(u => u[0] === r.kind)[2].toLowerCase()}` + (r.kind !== slot ? " (detected from the contents)" : ""));
      draw3(); draw4(); draw5(); drawChecks();
    };
    $$("[data-up]").forEach(inp => inp.onchange = async () => { const f = inp.files[0]; if (f) upload(await f.text(), inp.dataset.up); });
    $$("[data-paste]").forEach(b => b.onclick = () => openDialog(`<form id="pf"><h2>Paste ${UPLOADS.find(u => u[0] === b.dataset.paste)[1]}</h2>
      <textarea id="pt" style="min-height:280px" placeholder="Paste the command's output here"></textarea>
      <div class="actions"><button data-close>Cancel</button><button class="primary" type="submit">Load</button></div></form>`, d => {
        $("#pf", d).onsubmit = async e => { e.preventDefault(); const t = $("#pt", d).value; dlg.close(); upload(t, b.dataset.paste); }; }, "min(820px,94vw)"));
    $$("[data-clear]").forEach(b => b.onclick = async () => { P = await api(`/api/plans/${id}/cluster/${b.dataset.clear}`, {method: "DELETE"}); draw3(); draw4(); draw5(); });
  }

  // ---- 4. objectives
  const objectives = () => (P.cluster || {}).objectives || [];
  const OP_SETS = {pathlike: ["matches", "doesn't match", "==", "!="], bytes: ["<", "<=", ">", ">=", "=="], age: [">", ">=", "<", "<="], time: ["<", ">"], text: ["==", "!="], labels: ["has"], bool: ["is TRUE", "is FALSE"]};
  const UNIT_SETS = {bytes: ["BYTES", "KBYTES", "MBYTES", "GBYTES", "TBYTES"], age: ["MINUTES", "HOURS", "DAYS", "WEEKS", "MONTHS", "YEARS"]};
  function fieldKind(f) {
    if (f === "NAME" || f === "PATH" || f === "DPATH") return "pathlike";
    if (f.startsWith("HAS_")) return "bool";
    if (f.startsWith("GET_")) return "text";
    const k = (PCAT.fields[f] || {}).kind || "text";
    return k.startsWith("typed:") ? "text" : k;
  }
  function builderExpr(field, op, val, unit) {
    const k = fieldKind(field), typed = ((PCAT.fields[field] || {}).kind || "").startsWith("typed:") ? PCAT.fields[field].kind.slice(6) : null;
    if (k === "bool") return op === "is FALSE" ? `NOT ${field}` : field;
    if (k === "pathlike" && (op === "matches" || op === "doesn't match")) {
      if (!val) throw new Error(field === "NAME" ? "Enter a pattern like *.log" : "Enter a pattern like */scratch/*");
      return `${op === "doesn't match" ? "!" : ""}FNMATCH('${val.replace(/'/g, "")}', ${field})?TRUE`;
    }
    if (k === "labels") return `HAS_LABEL("${val.replace(/"/g, "")}")`;
    if (val === "") throw new Error("Enter a value");
    if (k === "bytes" || k === "age") { if (isNaN(+val)) throw new Error("Enter a number"); return `${field}${op}${+val}*${unit}`; }
    if (k === "time") return `${field}${op}LOCAL_TIME('${val}')`;
    if (typed) return `${field}${op}${typed}('${val.replace(/'/g, "")}')`;
    return `${field}${op}"${val.replace(/"/g, '\\"')}"`;
  }
  function draw4() {
    const objs = objectives(), rows = P.rows || [];
    const groups = [["Placement", o => o.effects.some(e => ["place", "confine", "exclude", "online", "optimize_capacity", "do_not_move", "performance"].includes(e))],
      ["Protection", o => o.effects.some(e => ["availability", "durability"].includes(e))], ["Other", () => true]];
    const used = new Set();
    const objOptions = sel => groups.map(([label, test]) => { const list = objs.filter(o => !used.has(o.name) && test(o)); list.forEach(o => used.add(o.name));
      return list.length ? `<optgroup label="${label}">${list.map(o => `<option value="${esc(o.name)}" ${o.name === sel ? "selected" : ""}>${esc(o.name)}</option>`).join("")}</optgroup>` : ""; }).join("");
    const fieldsAvail = [...new Set([...PCAT.required, ...(P.fields || []), ...(P.metas || []), "NAME", "PATH"])];

      ${objs.length ? "" : `<p class="errbox">Load objective-list --full in step 3 to choose objectives.</p>`}
      <div id="orows">${rows.map((r, i) => { used.clear(); const o = objs.find(x => x.name === r.objective);
        return `<div class="orow" data-row="${r.id}">
        <div class="head"><span class="num">${i + 1}</span>
          ${objs.length ? `<select data-k="objective" style="width:auto;min-width:280px"><option value="">Choose an objective…</option>${objOptions(r.objective)}</select>` : `<input type="text" data-k="objective" value="${esc(r.objective)}" style="width:280px">`}
          <span>${o ? badges(o.effects) : ""}</span><span class="spacer"></span><button class="ghost danger" data-rm="${r.id}">Remove</button></div>
        ${o && o.description ? `<p class="hint" style="margin:4px 0 0 32px">${esc(o.description)}</p>` : ""}
        <div class="grid3"><div><label class="f">Applies to</label><select data-k="scope.type">${[["share", "Whole share"], ["folder", "A folder"], ["file", "One file"]].map(([v, l]) => `<option value="${v}" ${(r.scope || {}).type === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
          <div ${((r.scope || {}).type || "share") === "share" ? "hidden" : ""}><label class="f">Folder</label><div class="row" style="flex-wrap:nowrap;gap:6px"><input type="text" class="mono" data-k="scope.path" value="${esc((r.scope || {}).path || "")}" placeholder="/projects/2026"><button type="button" data-pick="${r.id}">Browse…</button></div></div>
          <div ${(r.scope || {}).type === "file" ? "" : "hidden"}><label class="f">File name</label><input type="text" data-k="scope.name" value="${esc((r.scope || {}).name || "")}"></div></div>
        <div style="margin-top:10px"><label class="f">Condition <span class="hint" style="font-weight:400">(optional; leave empty to apply to every file in scope)</span></label>
          <div data-ed="${r.id}"></div><div class="status-line" data-st="${r.id}"></div>
          <div class="builder"><select data-b="join" aria-label="Combine with the condition above" hidden><option>AND</option><option>OR</option></select>
            <select data-b="field" aria-label="Field"><option value="">Choose a field…</option>${fieldsAvail.map(f => `<option>${esc(f)}</option>`).join("")}</select>
            <select data-b="op" aria-label="Operator" hidden></select><input type="text" data-b="val" aria-label="Value" placeholder="value" style="width:120px" hidden><select data-b="unit" aria-label="Unit" hidden></select>
            <button type="button" data-b="add" disabled>Add condition</button>
            <button type="button" class="ghost danger" data-b="clear" hidden>Clear condition</button></div></div>
        <ul class="msgs" data-msgs="${r.id}"></ul></div>`; }).join("")}</div>
      <div class="row" style="margin-top:10px"><button id="add-row">Add objective</button></div>`;
    const rowById = rid => (P.rows || []).find(r => r.id === rid);
    const saveRows = () => save({rows: P.rows});
    $("#add-row").onclick = () => { P.rows = [...(P.rows || []), {id: "n" + Date.now().toString(36), objective: "", scope: {type: "share"}, condition: ""}]; saveRows(); draw4(); };
    $$("[data-rm]").forEach(b => b.onclick = () => { P.rows = P.rows.filter(r => r.id !== b.dataset.rm); saveRows(); draw4(); });
    $$(".orow").forEach(el => {
      const r = rowById(el.dataset.row);
      $$("[data-k]", el).forEach(inp => inp.addEventListener(inp.tagName === "SELECT" ? "change" : "input", () => {
        const k = inp.dataset.k;
        if (k.startsWith("scope.")) { r.scope = {...(r.scope || {type: "share"}), [k.slice(6)]: inp.value}; } else r[k] = inp.value;
        saveRows();
        if (k === "objective" || k === "scope.type") draw4(); else check(r);
      }));
      $("[data-pick]", el) && ($("[data-pick]", el).onclick = () => folderPicker(p => { r.scope = {...r.scope, path: p}; $("[data-k='scope.path']", el).value = p; saveRows(); check(r); }));
      const ed = codeEditor($(`[data-ed="${r.id}"]`, el), {value: r.condition || "", light: true, label: "Condition",
        onInput: v => { r.condition = v; saveRows(); check(r); el._syncJoin && el._syncJoin(); }});
      el._ed = ed;
      // builder
      const bf = $("[data-b=field]", el), bo = $("[data-b=op]", el), bv = $("[data-b=val]", el), bu = $("[data-b=unit]", el);
      const bj = $("[data-b=join]", el), badd = $("[data-b=add]", el), bclr = $("[data-b=clear]", el);
      // The AND/OR choice only appears once there's a condition to combine with.
      const syncJoin = () => { const has = !!(r.condition || "").trim();
        bj.hidden = !has; bclr.hidden = !has; badd.textContent = has ? "Add" : "Add condition"; };
      el._syncJoin = syncJoin;
      const syncOps = () => {
        const chosen = !!bf.value;
        badd.disabled = !chosen;
        if (!chosen) { bo.hidden = bv.hidden = bu.hidden = true; return; }
        const k = fieldKind(bf.value);
        bo.hidden = false;
        bo.innerHTML = (OP_SETS[k] || OP_SETS.text).map(o => `<option>${esc(o)}</option>`).join("");
        bu.innerHTML = (UNIT_SETS[k] || []).map(u => `<option ${u === "DAYS" || u === "MBYTES" ? "selected" : ""}>${u}</option>`).join("");
        bu.hidden = !UNIT_SETS[k]; bv.hidden = k === "bool";
        bv.placeholder = k === "pathlike" ? (bf.value === "NAME" ? "*.log" : "*/scratch/*") : k === "time" ? "2026-01-31" : k === "labels" ? "label name" : ((PCAT.fields[bf.value] || {}).kind || "").startsWith("typed:") ? "name@domain" : "value"; };
      bf.onchange = () => { syncOps(); if (!bv.hidden) bv.focus(); }; syncOps(); syncJoin();
      const setCondition = text => { const ta = $(`[data-ed="${r.id}"] textarea`, el); ta.value = text; ta.dispatchEvent(new Event("input")); };
      const addExpr = () => { let e;
        try { e = builderExpr(bf.value, bo.value, bv.value.trim(), bu.value); } catch (err) { toast(err.message, true); bv.focus(); return; }
        const cur = (r.condition || "").trim();
        const wrap = x => x.includes("?") ? `(${x})` : x;  // keep a ternary like FNMATCH(...)?TRUE self-contained
        setCondition(cur ? `${wrap(cur)} ${bj.value} ${wrap(e)}` : e);
        // start the next entry from scratch
        bf.value = ""; bv.value = ""; bj.value = "AND"; syncOps(); syncJoin(); bf.focus(); };
      badd.onclick = addExpr;
      bv.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addExpr(); } };
      bclr.onclick = () => { setCondition(""); syncJoin(); };
      check(r);
    });
    drawChecks();
  }
  const checkTimers = {};
  function check(r) {
    clearTimeout(checkTimers[r.id]);
    checkTimers[r.id] = setTimeout(async () => {
      const st = $(`[data-st="${r.id}"]`); if (!st) return;
      const ed = $(`[data-ed="${r.id}"]`);
      try {
        const c = await api(`/api/plans/${id}/check`, {method: "POST", body: {condition: r.condition || "", scope: r.scope}});
        ed && ed.classList.toggle("bad", !c.ok);
        if (!c.ok) { st.className = "status-line bad"; st.textContent = c.error; return; }
        if (c.not_scanned.length) { st.className = "status-line bad"; st.textContent = `Not gathered by the scan: ${c.not_scanned.join(", ")}. Add ${c.not_scanned.length > 1 ? "them" : "it"} in step 2 and scan again.`; return; }
        st.className = "status-line ok";
        st.textContent = c.matches ? `✓ Matches ${num(c.matches.files)} files (${bytes(c.matches.bytes)})` + (c.matches.examples.length ? `, e.g. ${c.matches.examples.slice(0, 2).join(", ")}` : "") : (r.condition ? "✓ Valid. Scan the share to see what it matches." : "");
      } catch (e) { st.className = "status-line bad"; st.textContent = e.message; }
    }, 300);
  }
  function refreshAllChecks() { (P.rows || []).forEach(check); }
  function drawChecks() {
    (P.checks || []).forEach(c => { const ul = $(`[data-msgs="${c.id}"]`); if (!ul) return;
      ul.innerHTML = [...c.errors.map(e => `<li class="err">${esc(e)}</li>`), ...c.warnings.map(w => `<li class="warn">${esc(w)}</li>`), ...(c.notes ? [`<li class="note">${esc(c.notes)}</li>`] : [])].join(""); });
  }
  function folderPicker(onPick) {
    let cur = "/";
    openDialog(`<div class="body"><h2>Choose a folder</h2><p class="hint" style="margin-top:-6px">From the scan, relative to ${esc(P.root)}.</p><div class="crumbs" id="fp-c"></div><div class="dirlist" id="fp-l"></div>
      <div class="actions"><button data-close>Cancel</button><button class="primary" id="fp-ok">Choose</button></div></div>`, d => {
      const load = async p => { const r = await api(`/api/plans/${id}/folders?path=${encodeURIComponent(p)}`); cur = r.path;
        const parts = cur.split("/").filter(Boolean);
        $("#fp-c", d).innerHTML = `<button data-p="/">${esc(P.root)}</button>` + parts.map((x, i) => `/<button data-p="/${parts.slice(0, i + 1).map(esc).join("/")}">${esc(x)}</button>`).join("");
        $("#fp-l", d).innerHTML = (cur !== "/" ? `<button data-p="${esc("/" + parts.slice(0, -1).join("/"))}">..</button>` : "") + (r.dirs.map(x => `<button data-p="${esc((cur === "/" ? "" : cur) + "/" + x)}">${esc(x)}/</button>`).join("") || `<p class="hint" style="padding:10px 12px;margin:0">No subfolders${P.scan ? "" : " (scan the share first)"}.</p>`);
        $$("[data-p]", d).forEach(b => b.onclick = () => load(b.dataset.p)); $("#fp-ok", d).textContent = `Choose ${cur}`; };
      load("/"); $("#fp-ok", d).onclick = () => { onPick(cur); dlg.close(); };
    });
  }

  // ---- 5. settings
  function draw5() {
    const s = P.settings || {}, c = P.cluster || {};
    const groupsList = (c.volume_groups || []).map(g => g.name), volsList = [...(c.volumes || []), ...(c.object_volumes || [])].map(v => v.name);
    const dp = s.default_placement ? `${s.default_placement.kind}:${s.default_placement.name}` : "";
    $("#s5").innerHTML = `<h2><span class="n">5</span>Placement assumptions</h2>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr)">
        <div><label class="f" for="st-dp">Files no placement objective covers go to</label><select id="st-dp"><option value="">Any writable storage volume</option>
          ${groupsList.length ? `<optgroup label="Volume groups">${groupsList.map(g => `<option value="group:${esc(g)}" ${dp === "group:" + g ? "selected" : ""}>${esc(g)}</option>`).join("")}</optgroup>` : ""}
          ${volsList.length ? `<optgroup label="Volumes">${volsList.map(v => `<option value="volume:${esc(v)}" ${dp === "volume:" + v ? "selected" : ""}>${esc(v)}</option>`).join("")}</optgroup>` : ""}</select></div>
        <div><label class="f" for="st-min">Kept in metadata on object volumes when smaller than</label><div class="row" style="flex-wrap:nowrap"><input type="number" id="st-min" min="0" value="${esc(s.object_min_bytes ?? 40)}" style="flex:1"><span>bytes</span></div></div>
        <div><label class="f" for="st-basis">Space on storage volumes</label><select id="st-basis"><option value="size" ${s.size_basis !== "space_used" ? "selected" : ""}>Size, rounded up to 4 KiB blocks</option><option value="space_used" ${s.size_basis === "space_used" ? "selected" : ""}>SPACE_USED as reported</option></select></div></div>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="st-local" ${s.keep_local_without_optimize !== false ? "checked" : ""}>Keep a local (storage volume) instance unless optimize-for-capacity applies</label>
      <p class="hint" style="margin:6px 0 0">This is a model of Hammerspace's placement, not the cluster's own engine: each place-on objective adds an instance in its target, availability and durability objectives add instances on separate storage systems until the target is met, read-only volumes are never targets, and within a group each instance goes to the volume with the most free space left.</p>`;
    const set = patch => save({settings: {...(P.settings || {}), ...patch}});
    $("#st-dp").onchange = e => { const [k, ...n] = e.target.value.split(":"); set({default_placement: e.target.value ? {kind: k, name: n.join(":")} : null}); };
    $("#st-min").oninput = e => set({object_min_bytes: +e.target.value || 0});
    $("#st-basis").onchange = e => set({size_basis: e.target.value});
    $("#st-local").onchange = e => set({keep_local_without_optimize: e.target.checked});
  }

  // ---- 6. results
  function draw6() {
    const el = $("#s6");
    if (!result) { el.innerHTML = `<h2><span class="n">6</span>Space by volume</h2><p class="hint" style="margin:0">Scan the share, load the cluster information and add objectives, then <b>Calculate space</b>.</p>`; return; }
    const r = result, rowsById = Object.fromEntries((P.rows || []).map((x, i) => [x.id, [i + 1, x]]));
    const copies = Object.entries(r.copies).map(([k, v]) => `${num(v)} × ${k} ${+k === 1 ? "instance" : "instances"}`).join(", ") || "—";
    const sugg = r.uncovered && r.uncovered.suggestion;
    el.innerHTML = `<h2><span class="n">6</span>Space by volume <span class="hint" style="font-weight:400">· calculated ${when(r.calculated)}</span></h2>
      <div class="stats">
        <div class="stat"><b>${num(r.files)}</b><span>files modeled</span></div>
        <div class="stat"><b>${bytes(r.bytes)}</b><span>logical size</span></div>
        <div class="stat"><b>${num(r.instances)}</b><span>instances</span></div>
        <div class="stat"><b>${bytes(r.projected)}</b><span>space needed across volumes</span></div>
        <div class="stat"><b>${num(r.metadata_files)}</b><span>small files kept in metadata</span></div>
        ${r.unchanged_files ? `<div class="stat"><b>${num(r.unchanged_files)}</b><span>files not moved (do-not-move), ${bytes(r.unchanged_bytes)}</span></div>` : ""}
      </div>
      <p class="hint">Instances per file: ${copies}.</p>
      ${r.warnings.length ? `<ul class="wlist">${r.warnings.map(w => `<li class="${w.level}">${esc(w.text)}
        ${w.kind === "coverage" && w.level === "warn" ? `${r.uncovered.examples.length ? `<div class="hint">For example: <span class="mono">${r.uncovered.examples.slice(0, 5).map(esc).join(", ")}</span></div>` : ""}
          ${sugg ? `<div class="row" style="margin-top:6px;gap:6px"><span class="hint">Catch-all condition:</span><code>${esc(sugg)}</code>
            <select id="sugg-obj" style="width:auto;min-height:28px;padding:2px 6px">${objectives().filter(o => o.effects.some(e => PLACEMENT_EFFECTS.includes(e))).map(o => `<option>${esc(o.name)}</option>`).join("")}</select><button id="sugg-add" style="min-height:28px">Add as an objective</button></div>` : ""}` : ""}
        ${w.examples ? `<div class="hint mono">${w.examples.map(esc).join(", ")}</div>` : ""}</li>`).join("")}</ul>` : ""}
      ${targetsTable(r)}
      <h3 style="margin-top:14px">Files each objective applies to</h3>
      <table class="data"><tbody>${r.rows.map(x => { const [n, row] = rowsById[x.id] || ["?", {}]; return `<tr><td style="width:40px">${n}</td><td><b>${esc(row.objective || "")}</b> <span class="hint">${esc(row.condition || "")}</span></td><td class="num">${num(x.files)} files</td><td class="num">${bytes(x.bytes)}</td></tr>`; }).join("")}</tbody></table>
      <h3 style="margin-top:14px">Commands to apply this plan</h3>
      <div class="query"><pre id="cmds">${esc((r.commands || []).join("\n")) || "# Add objectives to generate commands"}</pre>
        <div class="row"><button id="cmd-copy">Copy</button><a class="btn" href="/api/plans/${id}/commands">Download</a>
          <span class="hint" style="color:#A9BBD6">One share-objective-add per objective: --path for a folder or file, and the condition as --applicability.</span></div></div>`;
    $$("[data-exp]").forEach(b => b.onclick = () => {
      const open = b.getAttribute("aria-expanded") !== "true";
      b.setAttribute("aria-expanded", open); b.textContent = open ? "Hide volumes" : "Show volumes";
      $$(`tr[data-of="${b.dataset.exp}"]`).forEach(tr => tr.hidden = !open);
    });
    $("#cmd-copy") && ($("#cmd-copy").onclick = () => navigator.clipboard.writeText($("#cmds").textContent).then(() => toast("Copied")));
    $("#sugg-add") && ($("#sugg-add").onclick = () => { P.rows = [...(P.rows || []), {id: "n" + Date.now().toString(36), objective: $("#sugg-obj").value, scope: {type: "share"}, condition: sugg}];
      save({rows: P.rows}); draw4(); toast("Added. Calculate again to update the results."); $("#s4").scrollIntoView({behavior: "smooth"}); });
  }

  function targetsTable(r) {
    const vols = Object.fromEntries((r.volumes || []).map(v => [v.name, v]));
    const share = (need, free, over) => free == null ? `<span class="hint">Unlimited</span>`
      : `<div class="row" style="flex-wrap:nowrap;gap:8px"><div class="pbar ${over ? "over" : ""}" style="flex:1"><i style="width:${Math.min(100, need / free * 100).toFixed(1)}%"></i></div><span class="hint">${(need / free * 100).toFixed(need / free < .01 ? 2 : 1)}%</span></div>`;
    const kindLabel = t => t.kind === "group" ? `Volume group · ${t.members.length} ${t.members.length === 1 ? "volume" : "volumes"}` : (t.volume_kind === "object" ? "Object volume" : "Storage volume");
    // Results from before targets existed: one row per volume
    const targets = r.targets || (r.volumes || []).filter(v => !v.excluded).map(v => ({kind: "volume", name: v.name, volume_kind: v.kind, node: v.node, members: [v.name], free: v.free, projected: v.projected, instances: v.instances, over: v.over}));
    const rows = targets.map((t, i) => `
      <tr><td><b>${esc(t.name)}</b>${t.kind === "group" ? `<button class="expand" data-exp="${i}" aria-expanded="false">Show volumes</button>` : ""}</td>
        <td>${kindLabel(t)}</td><td>${t.kind === "group" ? (() => { const n = new Set(t.members.map(m => (vols[m] || {}).node || m)).size;
          return `<span class="hint">${n} storage ${n === 1 ? "system" : "systems"}</span>`; })() : esc(t.node || "")}</td>
        <td class="num">${t.free == null ? "Unlimited" : bytes(t.free)}</td><td class="num"><b>${bytes(t.projected)}</b></td>
        <td>${share(t.projected, t.free, t.over)}</td><td class="num">${num(t.instances)}</td></tr>
      ${t.kind === "group" ? t.members.map(m => { const v = vols[m] || {}; return `<tr class="member" data-of="${i}" hidden>
        <td>${esc(m)}</td><td>${v.kind === "object" ? "Object volume" : "Storage volume"}</td><td>${esc(v.node || "")}</td>
        <td class="num">${v.free == null ? "Unlimited" : bytes(v.free)}</td><td class="num">${bytes(v.projected || 0)}</td>
        <td>${share(v.projected || 0, v.free, v.over)}</td><td class="num">${num(v.instances || 0)}</td></tr>`; }).join("") : ""}`).join("");
    const nt = r.not_targets || [];
    return `<div class="scroll"><table class="data" id="tgt-table"><thead><tr><th>Placed on</th><th>Type</th><th>Storage system</th><th class="num">Free now</th><th class="num">Needed for this share</th><th style="min-width:140px">Share of free space</th><th class="num">Instances</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <p class="hint" style="margin:6px 0 0">Volume groups the plan places data on are shown as one row: free space is the total across the group's writable volumes, and copies kept for other reasons (a local copy, an extra availability copy) count toward the group their volume is in. Volumes in more than one group can count toward each group's free space.${nt.length ? ` Not used as targets: ${nt.map(v => esc(v.name) + (v.read_only ? " (read-only)" : "")).join(", ")}.` : ""}</p>`;
  }

  $("#pl-calc").onclick = async () => {
    clearTimeout(saveTimer);
    if (Object.keys(pending).length) { const body = pending; pending = {}; P = await api(`/api/plans/${id}`, {method: "PUT", body}); drawChecks(); }
    const b = $("#pl-calc"); b.disabled = true; b.textContent = "Calculating…";
    try { result = await api(`/api/plans/${id}/calculate`, {method: "POST"}); draw6(); $("#s6").scrollIntoView({behavior: "smooth"}); }
    catch (e) { toast(e.message, true); }
    finally { b.disabled = false; b.textContent = "Calculate space"; }
  };

  head(); draw1(); draw2(); draw3(); draw4(); draw5(); draw6();
  if (P.scan && P.scan.status === "running") poll();
}


route();
</script>
</body>
</html>
