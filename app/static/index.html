<style>
/* Styled after the Hammerspace management console */
:root{
  --navy:#2F4C79; --navy-line:#2E3D57; --navy-active:#358BC9;
  --paper:#FFFFFF; --panel:#FFFFFF; --ink:#191919; --ink-2:#595959; --ink-3:#8E8E8E;
  --rule:#D4D4D4; --rule-2:#EBEBEB; --frame:#A9A9A9;
  --accent:#358BC9; --accent-ink:#FFFFFF; --accent-soft:#E9F3FC; --link:#0075D9;
  --bar:#60A5ED; --bar-soft:#D3E6FB;
  --green:#83DDAD; --green-ink:#1E5638; --amber:#8A6400; --amber-soft:#FFDD7E; --red:#E0334F; --red-soft:#FFE3E8; --red-solid:#FF4767;
  --code-bg:#22344F; --code-ink:#E6EDF6;
  --tok-key:#8CCBFF; --tok-op:#FFDD7E; --tok-str:#FF9FB0; --tok-num:#83DDAD; --tok-brace:#8FA3BF;
  --sans:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums}
a{color:var(--link)}
code,.mono{font-family:var(--mono);font-size:.86em}
:focus-visible{outline:2px solid var(--navy-active);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;height:56px;background:var(--navy);color:#fff;display:flex;align-items:stretch}
.topbar .logo{display:flex;align-items:center;padding:0 16px 0 14px;text-decoration:none}
.topbar .logo img{height:26px;width:auto;display:block}
.topbar .spacer{flex:1}
.topbar .blk{display:flex;flex-direction:column;justify-content:center;padding:0 16px;border-left:1px solid var(--navy-line);font-size:13px;line-height:1.25;white-space:nowrap}
.topbar .blk b{font-weight:700;letter-spacing:.02em}
.topbar .blk small{font-size:11px;font-weight:700;letter-spacing:.04em;opacity:.85}

/* layout and icon rail */
.app{display:grid;grid-template-columns:48px 1fr;min-height:calc(100% - 56px)}
.app.wide{grid-template-columns:200px 1fr}
nav.rail{background:var(--navy);position:sticky;top:56px;height:calc(100vh - 56px);display:flex;flex-direction:column;padding:4px 0}
nav.rail button.ham{all:unset;cursor:pointer;height:40px;display:flex;align-items:center;justify-content:center;color:#fff}
nav.rail a{height:44px;display:flex;align-items:center;gap:14px;padding:0 14px;color:#fff;text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden}
nav.rail a svg,nav.rail button.ham svg{flex:none;width:20px;height:20px}
nav.rail a span{display:none}
.app.wide nav.rail a span{display:inline}
.app.wide nav.rail button.ham{justify-content:flex-start;padding-left:14px}
nav.rail a:hover{background:rgba(255,255,255,.08)}
nav.rail a[aria-current=page]{background:var(--navy-active)}
main{padding:14px 24px 48px;min-width:0}

/* headings */
header.page{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;flex-wrap:wrap;min-height:36px}
h1{font-size:20px;font-weight:600;margin:0;line-height:1.3;color:var(--ink)}
h2{font-size:14px;margin:0 0 10px;font-weight:600;color:var(--ink-2)}
h3{font-size:13px;margin:0 0 6px;font-weight:600;color:var(--ink-2)}
.sub{color:var(--ink-2);margin:2px 0 0;max-width:80ch;font-size:13px}

/* panels: square, thin gray frame, gray title */
.panel{background:var(--panel);border:1px solid var(--frame);border-radius:0;padding:12px 14px}
.stack>*+*{margin-top:12px}

/* controls */
button,.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:6px 14px;border-radius:2px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:32px}
button:hover,.btn:hover{border-color:var(--ink-3);background:#FAFAFA}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover,.btn.primary:hover{background:#2C7AB4;border-color:#2C7AB4}
button.danger{color:var(--red)}
button.ghost,.btn.ghost{border-color:transparent;background:transparent;color:var(--link);padding:5px 8px;font-weight:600}
button.ghost:hover,.btn.ghost:hover{background:var(--accent-soft);border-color:transparent}
button.ghost.danger{color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=number],input[type=password],select,textarea{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:2px;padding:5px 9px;width:100%;min-height:32px}
textarea{font-family:var(--mono);font-size:13px;min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:15px;height:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;padding:3px 0}
.check input{margin-top:3px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 14px}

/* tabs (segmented) */
.seg{display:inline-flex;border-bottom:1px solid var(--rule);flex-wrap:wrap;gap:4px}
.seg button{border:0;border-radius:0;background:none;color:var(--ink-2);padding:6px 12px;min-height:0;border-bottom:3px solid transparent;margin-bottom:-1px}
.seg button:hover{background:none;color:var(--ink)}
.seg button[aria-pressed=true]{color:var(--link);border-bottom-color:var(--accent)}

/* tables */
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{text-align:left;font-weight:600;color:var(--ink-2);font-size:13px;padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0;background:#fff}
table.data td{padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
table.data tbody tr:hover td{background:#F5F9FD}
table.data tr:last-child td{border-bottom:0}
table.data td.num,table.data th.num{text-align:right}
table.data td .row{flex-wrap:nowrap}
table.data td .mono{white-space:nowrap}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
.scroll{overflow:auto;max-width:100%}

/* status: the console's health colors */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--rule-2);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--green);color:var(--green-ink)}
.pill.warn{background:var(--amber-soft);color:#5C4500}
.pill.bad{background:var(--red-solid);color:#fff}
.pill.run::before{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.run::before{animation:none}}
.empty{text-align:center;padding:36px 20px;color:var(--ink-2)}
.empty p{margin:0 0 14px}
.bar{position:relative}
.bar i{position:absolute;inset:4px auto 4px 0;background:var(--bar-soft);border-left:3px solid var(--bar);z-index:0}
.bar span{position:relative;z-index:1}
details.top summary{cursor:pointer;color:var(--link);font-size:13px}
details.top ol{margin:6px 0 0;padding-left:20px;font-size:13px}
details.top li{white-space:nowrap}

/* designer */
.designer{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,420px);gap:16px;align-items:start}
.sticky{position:sticky;top:70px}
.query{background:var(--code-bg);color:var(--code-ink);padding:14px 14px 12px;border:1px solid var(--code-bg)}
.query h3{color:#A9BBD6;font-weight:600}
.query pre:last-child{margin-bottom:0}
.query pre{margin:0 0 14px;font:13px/1.6 var(--mono);white-space:pre-wrap;word-break:break-all}
.query .err{color:#FFB3C0;font:13px var(--sans)}
.tok-key{color:var(--tok-key)} .tok-op{color:var(--tok-op);font-weight:500} .tok-str{color:var(--tok-str)} .tok-num{color:var(--tok-num)} .tok-br{color:var(--tok-brace)}
.cmd{font:12px/1.55 var(--mono);color:#B9C8DE;word-break:break-all;margin:0 0 6px}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qhead h3{margin:0}
.qtag{font-size:11px;font-weight:700;background:var(--amber-soft);color:#5C4500;padding:1px 8px;border-radius:99px}
.qbtn{all:unset;cursor:pointer;color:#8CCBFF;font-size:12.5px;font-weight:600}
.qbtn:hover{text-decoration:underline}
.qbtn:focus-visible{outline:2px solid #8CCBFF;outline-offset:2px}
.qnote{font-size:12px;color:#A9BBD6;margin:6px 0 12px}
.qnote.err{color:#FFB3C0}
.query .row button:not(.primary){background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.query .row button:not(.primary):hover{background:rgba(255,255,255,.08)}
/* editable HammerScript: a transparent textarea over the highlighted text */
.code-edit{position:relative}
.code-edit pre,.code-edit textarea{margin:0;padding:8px 10px;font:13px/1.6 var(--mono);white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;border:1px solid rgba(255,255,255,.2);border-radius:2px;letter-spacing:normal}
.code-edit pre{color:var(--code-ink);min-height:44px;background:rgba(0,0,0,.18)}
.code-edit textarea{position:absolute;inset:0;width:100%;height:100%;min-height:0;background:transparent;color:transparent;caret-color:#fff;resize:none;overflow:hidden}
.code-edit textarea:focus{outline:none;border-color:var(--navy-active);box-shadow:0 0 0 2px rgba(53,139,201,.4)}
.code-edit textarea::selection{background:rgba(140,203,255,.35);color:transparent}
.code-edit .tok-op{font-weight:inherit}
.code-edit.light pre{background:#F6F7F9;color:var(--ink);border-color:var(--rule)}
.code-edit.light textarea{caret-color:var(--ink);border-color:var(--rule)}
.code-edit.light textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.code-edit.light textarea::selection{background:rgba(53,139,201,.25)}
.code-edit.light .tok-key{color:#0B5CAD}.code-edit.light .tok-op{color:#A35A00}.code-edit.light .tok-str{color:#B0204A}
.code-edit.light .tok-num{color:#1E7A4C}.code-edit.light .tok-br{color:#6B7A8C}
.code-edit.bad pre{border-color:var(--red-solid)}
/* objective planning */
.steps>section{position:relative}
.steps h2 .n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;align-items:center;justify-content:center;margin-right:8px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:2px;background:var(--rule-2);color:var(--ink-2);margin-left:4px;text-transform:uppercase;letter-spacing:.02em}
.badge.place{background:#DCEBFA;color:#0B4F8A}.badge.protect{background:#DFF5E8;color:#1E5638}.badge.limit{background:#FFF1CC;color:#5C4500}.badge.none{background:var(--rule-2);color:var(--ink-3)}
.orow{border:1px solid var(--rule);padding:12px;background:#FCFCFD}
.orow+.orow{margin-top:10px}
.orow .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.orow .num{font-weight:700;color:var(--ink-3);min-width:22px}
.orow .grid3{display:grid;grid-template-columns:180px 1fr 200px;gap:10px;margin-top:10px}
.builder{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.builder select,.builder input{width:auto;min-height:28px;padding:3px 7px;font-size:13px}
.builder button{min-height:28px;padding:3px 10px;font-size:12.5px}
.status-line{font-size:12.5px;margin-top:4px;color:var(--ink-2)}
.status-line.ok{color:#1E7A4C}.status-line.bad{color:var(--red)}
.msgs{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.msgs li{padding:2px 0}.msgs li.err{color:var(--red)}.msgs li.warn{color:#8A6400}.msgs li.note{color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--rule);padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:600;color:var(--ink)}
.stat span{font-size:12.5px;color:var(--ink-2)}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{border-left:4px solid var(--rule);padding:8px 12px;margin-bottom:8px;background:#FAFAFA;font-size:14px}
.wlist li.warn{border-color:#E0A000;background:#FFFBEB}.wlist li.error{border-color:var(--red-solid);background:var(--red-soft)}.wlist li.info{border-color:var(--navy-active);background:var(--accent-soft)}
.upl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.upl .card{border:1px solid var(--rule);padding:10px 12px}
.upl .card code{font-size:12px}
.upl .card.ok{border-left:4px solid var(--green)}
.pbar{height:8px;background:var(--rule-2);position:relative;min-width:80px}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--bar)}
.pbar.over i{background:var(--red-solid)}
tr.muted td{color:var(--ink-3)}
.calc-bar{display:flex;align-items:center;gap:12px;padding:4px 0}
.calc-bar button{min-height:38px;padding:8px 20px;font-size:14px}
tr.member td{background:#FAFBFC;font-size:13px}
tr.member td:first-child{padding-left:30px}
button.expand{all:unset;cursor:pointer;color:var(--link);font-size:12.5px;font-weight:600;margin-left:8px}
button.expand:hover{text-decoration:underline}
.fields{list-style:none;margin:0;padding:0}
.fields li{display:flex;align-items:center;gap:6px;padding:4px 6px}
.fields li:hover{background:#F5F9FD}
.fields li.off .fname{color:var(--ink-3);text-decoration:line-through}
.fields .fname{flex:1}
.fields button{padding:2px 7px;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border:1px solid #C5DDF2;border-radius:2px;padding:2px 4px 2px 9px;font:13px var(--mono)}
.chip button{padding:0 6px;border:0;background:none;font-size:15px;line-height:1;min-height:0;color:var(--ink-2)}

/* dialogs and menus */
dialog{border:1px solid var(--frame);border-radius:0;padding:0;background:#fff;color:var(--ink);width:min(620px,94vw);box-shadow:0 12px 40px rgba(20,32,52,.28);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(30,45,70,.45)}
dialog form,dialog .body{padding:18px 20px 20px}
dialog h2{font-size:16px;color:var(--ink)}
dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin:18px -20px -20px;padding:12px 20px 16px;position:sticky;bottom:-20px;background:#fff;border-top:1px solid var(--rule-2)}
dialog .scroll td,dialog .scroll th{white-space:nowrap}
.crumbs{font:13px var(--mono);color:var(--ink-2);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:2px}
.crumbs button{padding:1px 4px;font:inherit;border:0;background:none;color:var(--link);min-height:0}
.dirlist{border:1px solid var(--rule);max-height:320px;overflow:auto}
.dirlist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule-2);border-radius:0;font:13.5px var(--mono);padding:8px 12px;min-height:0}
.dirlist button:hover{background:var(--accent-soft)}
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu summary::after{content:"▾";font-size:11px;margin-left:2px}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);z-index:15;width:330px;background:#fff;border:1px solid var(--frame);box-shadow:0 10px 28px rgba(20,32,52,.18);padding:4px 0}
.menu-pop a{display:block;padding:8px 14px;color:var(--ink);text-decoration:none;font-size:14px}
.menu-pop a:hover{background:var(--accent-soft)}
.menu-pop a b{font-weight:600}
.menu-pop a span{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px}
.menu-list{max-height:calc(100vh - 140px);overflow:auto}
.menu-list a{padding:6px 14px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;font-size:14px;max-width:420px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.25);border-left:4px solid var(--navy-active)}
.toast.bad{background:#fff;color:var(--red);border:1px solid var(--red-solid);border-left:4px solid var(--red-solid)}

/* misc */
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--ink-2);align-items:center}
.meta b{color:var(--ink);font-weight:600}
pre.raw{background:#F6F7F9;border:1px solid var(--rule-2);padding:12px;font:12px/1.5 var(--mono);max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:8px 0 0}
.errbox{background:var(--red-soft);color:#A3162E;border-left:4px solid var(--red-solid);padding:10px 12px;font-size:14px;white-space:pre-wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.colpick{display:flex;flex-wrap:wrap;gap:4px}
.colpick button{font-size:12.5px;padding:3px 10px;border-radius:99px;min-height:0;font-weight:600}
.colpick button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--link)}
@media (max-width:1100px){.designer{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:760px){
  .topbar .blk.date{display:none}
  .app,.app.wide{grid-template-columns:1fr}
  nav.rail{position:static;height:auto;flex-direction:row;padding:0 4px}
  nav.rail button.ham{display:none}
  nav.rail a span{display:inline}
  main{padding:14px 14px 40px}.grid2{grid-template-columns:1fr}
}
</style>
</head>

<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const view = $("#view"), dlg = $("#dlg");
let CAT = null, pollTimer = null;

async function api(path, opts={}) {
  const init = {method: opts.method || "GET", headers: {}};
  if (opts.body !== undefined) { init.body = JSON.stringify(opts.body); init.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, init);
  const text = await r.text();
  let data; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!r.ok) {
    let msg = data && data.detail !== undefined ? data.detail : text;
    if (Array.isArray(msg)) msg = msg.map(d => d.msg).join("; ");
    throw new Error(msg || `Request failed (${r.status})`);
  }
  return data;
}
function toast(msg, bad=false) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg; t.setAttribute("role", "status");
  const others = $$(".toast");
  t.style.bottom = `${20 + others.reduce((h, o) => h + o.offsetHeight + 8, 0)}px`;
  document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 6000 : 2800);
}
async function act(fn, okMsg) { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, true); throw e; } }
const UNITS = ["B","KB","MB","GB","TB","PB"];
const UNIT_F = {bytes: 1, kb: 1e3, mb: 1e6, gb: 1e9, tb: 1e12};
const UNIT_L = {bytes: "bytes", kb: "KB", mb: "MB", gb: "GB", tb: "TB"};
function bytes(n, unit) {
  if (typeof n !== "number") return esc(n);
  if (unit && unit !== "auto" && UNIT_F[unit]) {
    const v = n / UNIT_F[unit];
    return unit === "bytes" ? n.toLocaleString() : v.toLocaleString(undefined, {maximumFractionDigits: v < 10 ? 3 : 2});
  }
  let i = 0, v = n; while (Math.abs(v) >= 1000 && i < UNITS.length-1) { v /= 1000; i++; }
  return (i ? v.toFixed(v < 10 ? 2 : 1) : v) + " " + UNITS[i];
}
const num = n => typeof n === "number" ? n.toLocaleString() : esc(n);
function when(ts) {
  if (!ts) return "—";
  const d = new Date(ts*1000);
  return d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
}
function dur(a, b) { if (!a || !b) return ""; const s = Math.round(b-a); return s < 60 ? `${s}s` : `${Math.floor(s/60)}m ${s%60}s`; }
function statusPill(s) {
  const map = {done:["ok","Done"], partial:["warn","Partial"], failed:["bad","Failed"], running:["warn run","Running"], queued:["run","Queued"]};
  const [cls, label] = map[s] || ["", s || "—"];
  return `<span class="pill ${cls}">${label}</span>`;
}
function highlight(exp) {
  // Tokenize the raw text, then escape each piece: matching patterns on escaped HTML would
  // break entities (the 39 in &#39;).
  const re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\|::|::|\|\||&&|>=|<=|!=|==|[|?:<>!=])|([{}\[\]()])|(\b\d+(?:\.\d+)?\b(?![A-Za-z_]))|(\b\d*[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*\b)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(exp))) {
    out += esc(exp.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += `<span class="tok-str">${t}</span>`;
    else if (m[2]) out += `<span class="tok-op">${t}</span>`;
    else if (m[3]) out += `<span class="tok-br">${t}</span>`;
    else if (m[4]) out += `<span class="tok-num">${t}</span>`;
    else {
      const w = m[0];
      if (/^(AND|OR|NOT|IF|THEN|ELSE)$/.test(w)) out += `<span class="tok-op">${t}</span>`;
      else if (/^(KEY|VALUE|ROW)$/.test(w)) out += `<span class="tok-br">${t}</span>`;
      else if (/^\d*[A-Z_][A-Z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$/.test(w)) out += `<span class="tok-key">${t}</span>`;
      else out += t;  // lowercase words such as the bytes in SPACE_USED/bytes
    }
    last = re.lastIndex;
  }
  return out + esc(exp.slice(last));
}

// Editable HammerScript field with syntax colors. Single line: hs -e takes one expression.
function codeEditor(el, {value = "", onInput, onRun, label = "HammerScript expression", light = false} = {}) {
  el.className = "code-edit" + (light ? " light" : "");
  el.innerHTML = `<pre aria-hidden="true"></pre><textarea spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="${esc(label)}"></textarea>`;
  const pre = el.querySelector("pre"), ta = el.querySelector("textarea");
  const paint = () => { pre.innerHTML = highlight(ta.value) + "\n"; };
  ta.value = value; paint();
  ta.addEventListener("input", () => {
    if (/\n/.test(ta.value)) { const pos = ta.selectionStart; ta.value = ta.value.replace(/\s*\n\s*/g, " "); ta.selectionStart = ta.selectionEnd = Math.min(pos, ta.value.length); }
    paint(); onInput && onInput(ta.value);
  });
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); if ((e.ctrlKey || e.metaKey) && onRun) onRun(); }
  });
  return {
    get: () => ta.value,
    set: v => { if (document.activeElement !== ta && ta.value !== v) { ta.value = v; paint(); } },
    focused: () => document.activeElement === ta,
  };
}

function setNav(route) {
  $$("nav.rail a").forEach(a => a.getAttribute("href") === "#/" + route ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
}
function openDialog(html, onMount, width) {
  dlg.style.width = width || "";
  dlg.innerHTML = html; dlg.showModal(); if (onMount) onMount(dlg);
  $$("[data-close]", dlg).forEach(b => b.onclick = e => { e.preventDefault(); dlg.close(); });
}

// ---------------------------------------------------------------- router
const routes = {
  reports: renderReports, design: renderDesigner, runs: renderRuns, run: renderRun,
  schedules: renderSchedules, shares: renderShares, plans: renderPlans, plan: renderPlan, settings: renderSettings,
};
async function route() {
  clearTimeout(pollTimer);
  if (dlg.open) dlg.close();  // a dialog belongs to the page it was opened on
  const [name, id] = (location.hash.replace(/^#\/?/, "").split("?")[0] || "reports").split("/");
  setNav(name === "design" ? "reports" : name === "run" ? "runs" : name === "plan" ? "plans" : name);
  if (!CAT) CAT = await api("/api/catalog");
  try { await (routes[name] || renderReports)(id); }
  catch (e) { view.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
}
window.addEventListener("hashchange", route);

// Top bar date, in the console's style: "Friday, 2 Oct, 9:54 AM EDT"
function tick() {
  const d = new Date();
  const day = d.toLocaleDateString(undefined, {weekday: "long"});
  const date = d.toLocaleDateString("en-GB", {day: "numeric", month: "short"});
  const time = d.toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit", timeZoneName: "short"});
  $("#clock").textContent = `${day}, ${date}, ${time}`;
}
tick(); setInterval(tick, 30000);

// Rail labels toggle, remembered for next time
const appEl = $("#app"), ham = $("#ham");
const setWide = on => { appEl.classList.toggle("wide", on); ham.setAttribute("aria-expanded", on); ham.setAttribute("aria-label", on ? "Hide menu labels" : "Show menu labels"); };
try { setWide(localStorage.getItem("hsr-rail") === "wide"); } catch {}
ham.onclick = () => { const on = !appEl.classList.contains("wide"); setWide(on); try { localStorage.setItem("hsr-rail", on ? "wide" : "narrow"); } catch {} };
document.addEventListener("click", e => $$("details.menu[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; }));

// ---------------------------------------------------------------- shares
async function renderShares() {
  const list = await api("/api/shares");
  view.innerHTML = `
  <header class="page"><div><h1>Shares</h1>
    <p class="sub">Hammerspace NFS or SMB shares the reports run against. hstk needs a direct mount of a Hammerspace share, not a re-export.</p></div>
    <div class="row"><button id="import">Import from cluster</button><button class="primary" id="add">Add share</button></div></header>
  <div class="panel">${list.length ? `<div class="scroll"><table class="data">
    <thead><tr><th>Name</th><th>Connection</th><th>Mounted at</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map(s => `<tr>
      <td><b>${esc(s.name)}</b>${s.auto_mount ? `<div class="hint">Mounts on startup</div>` : ""}</td>
      <td class="mono">${s.kind === "local" ? "local " + esc(s.local_path) : `${s.kind} ${esc(s.kind === "smb" ? "//" + s.server + "/" + s.export.replace(/^\//,"") : s.server + ":" + s.export)}`}</td>
      <td class="mono">${esc(s.status.root || "")}</td>
      <td>${s.status.error ? `<span class="pill bad" title="${esc(s.status.error)}">Error</span>` :
            s.status.stale ? `<span class="pill bad" title="The server no longer recognizes this mount, usually after sleep, a network change or a failover">Stale</span>` :
            s.status.mounted ? (s.status.hammerspace ? `<span class="pill ok">Mounted</span>` :
            `<span class="pill warn" title="The hstk gateway file wasn't found; hs commands will fail unless this is a Hammerspace mount">Mounted, not Hammerspace</span>`) :
            `<span class="pill">Not mounted</span>`}</td>
      <td><div class="row" style="justify-content:flex-end">
        ${s.kind !== "local" ? (s.status.stale ? `<button class="primary" data-remount="${s.id}">Remount</button>` : s.status.mounted ? `<button data-un="${s.id}">Unmount</button>` : `<button data-mount="${s.id}">Mount</button>`) : ""}
        <button class="ghost" data-edit="${s.id}">Edit</button>
        <button class="ghost danger" data-del="${s.id}">Delete</button></div></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty"><p>No shares yet. Add a Hammerspace share, or import them from the cluster's share list.</p><div class="row" style="justify-content:center"><button id="import2">Import from cluster</button><button class="primary" id="add2">Add share</button></div></div>`}
  </div>`;
  const byId = Object.fromEntries(list.map(s => [s.id, s]));
  $$("#add,#add2").forEach(b => b.onclick = () => shareDialog());
  $$("#import,#import2").forEach(b => b.onclick = () => importDialog());
  $$("[data-edit]").forEach(b => b.onclick = () => shareDialog(byId[b.dataset.edit]));
  $$("[data-mount]").forEach(b => b.onclick = async () => { b.disabled = true; b.textContent = "Mounting…";
    await act(() => api(`/api/shares/${b.dataset.mount}/mount`, {method:"POST"}), "Mounted").finally(renderShares); });
  $$("[data-remount]").forEach(b => b.onclick = async () => { b.disabled = true; b.textContent = "Remounting…";
    await act(() => api(`/api/shares/${b.dataset.remount}/remount`, {method:"POST"}), "Remounted").finally(renderShares); });
  $$("[data-un]").forEach(b => b.onclick = async () => { await act(() => api(`/api/shares/${b.dataset.un}/unmount`, {method:"POST"}), "Unmounted").finally(renderShares); });
  $$("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm(`Delete share "${byId[b.dataset.del].name}"? Reports that use it will stop working.`)) return;
    await act(() => api(`/api/shares/${b.dataset.del}`, {method:"DELETE"}), "Share deleted"); renderShares(); });
}
// ---- import shares from `share-list` output
function insecureReminder(names) {
  return `<b>${names.length === 1 ? `${esc(names[0])} only accepts` : `${names.length} of these shares only accept`} NFS connections from privileged ports</b> (Insecure: false in the export options).
    The machine running this app may connect from other ports, for example through Docker's networking on a Mac, and the cluster would then refuse the mount.
    Before mounting, either <b>enable insecure ports on the share's export</b>, or <b>add an export rule for the machine running this app</b>
    (the IP address the cluster sees it connect from) that allows insecure ports.${names.length > 1 ? `<div class="hint mono" style="margin-top:4px">${names.map(esc).join(", ")}</div>` : ""}`;
}

function importDialog() {
  openDialog(`<form id="imf"><h2>Import shares from the cluster</h2><div class="stack">
    <p class="hint" style="margin:0">On the cluster, run <code>share-list</code> and upload or paste its output. You'll choose the shares to add next.</p>
    <textarea id="im-text" style="min-height:240px" placeholder="Paste the output of share-list here"></textarea>
    <label class="btn" style="align-self:flex-start">Upload file<input type="file" id="im-file" hidden accept=".txt,text/plain"></label>
  </div><div class="actions"><button data-close>Cancel</button><button class="primary" type="submit">Continue</button></div></form>`, d => {
    $("#im-file", d).onchange = async e => { const f = e.target.files[0]; if (f) { $("#im-text", d).value = await f.text(); $("#imf", d).requestSubmit(); } };
    $("#imf", d).onsubmit = async e => {
      e.preventDefault();
      const r = await act(() => api("/api/shares/import/parse", {method: "POST", body: {text: $("#im-text", d).value}}));
      if (!r.shares.length) { toast("The list has no shares besides the root share", true); return; }
      importPick(r);
    };
  }, "min(860px,94vw)");
}

function importPick(parsed) {
  const shares = parsed.shares;
  openDialog(`<form id="ipf"><h2>Choose shares to add</h2><div class="stack">
    <div class="grid2"><div><label class="f" for="ip-server">Cluster IP address or FQDN</label><input type="text" id="ip-server" placeholder="10.200.10.160 or anvil.example.com" required>
        <div class="hint">The address the shares are mounted from.</div></div>
      <div><label class="f">Protocol</label><div class="row" style="gap:18px;min-height:32px">
        <label class="check"><input type="checkbox" id="ip-nfs" checked>NFS</label><label class="check"><input type="checkbox" id="ip-smb">SMB</label></div>
        <div class="hint">Choose both to add each share twice, once per protocol.</div></div></div>
    <div id="ip-smbcreds" hidden><div class="grid2" style="grid-template-columns:repeat(3,1fr)">
      <div><label class="f" for="ip-user">SMB username</label><input type="text" id="ip-user" autocomplete="off"></div>
      <div><label class="f" for="ip-pass">Password</label><input type="password" id="ip-pass" autocomplete="new-password"></div>
      <div><label class="f" for="ip-dom">Domain</label><input type="text" id="ip-dom" placeholder="Optional"></div></div></div>
    <div class="scroll" style="max-height:300px"><table class="data"><thead><tr><th style="width:32px"><input type="checkbox" id="ip-all" aria-label="Select all"></th><th>Share</th><th>Path</th><th>State</th><th>Notes</th></tr></thead><tbody>
      ${shares.map((s, i) => `<tr><td><input type="checkbox" data-i="${i}" aria-label="Add ${esc(s.name)}" ${s.state === "PUBLISHED" ? "checked" : ""}></td>
        <td><b>${esc(s.name)}</b></td><td class="mono">${esc(s.path)}</td><td>${s.state === "PUBLISHED" ? `<span class="pill ok">Published</span>` : `<span class="pill">${esc(s.state ? s.state[0] + s.state.slice(1).toLowerCase() : "—")}</span>`}</td>
        <td data-note="${i}"></td></tr>`).join("")}</tbody></table></div>
    ${parsed.root_excluded ? `<p class="hint" style="margin:0">The root share (/) isn't listed: reports and plans work inside a share.</p>` : ""}
    <div id="ip-reminder"></div>
    <div class="row" style="gap:18px"><label class="check"><input type="checkbox" id="ip-mount" checked>Mount them now</label>
      <label class="check"><input type="checkbox" id="ip-auto" checked>Mount when the service starts</label></div>
  </div><div class="actions"><button data-close>Cancel</button><button class="primary" type="submit" id="ip-go">Add shares</button></div></form>`, d => {
    const boxes = $$("[data-i]", d);
    const sel = () => boxes.filter(b => b.checked).map(b => shares[+b.dataset.i]);
    const protos = () => ["nfs", "smb"].filter(p => $(`#ip-${p}`, d).checked);
    const update = () => {
      const nfs = $("#ip-nfs", d).checked, smb = $("#ip-smb", d).checked, picked = sel(), n = picked.length * protos().length;
      $("#ip-smbcreds", d).hidden = !smb;
      shares.forEach((s, i) => {
        const notes = [];
        if (nfs && !s.insecure_allowed) notes.push(`<span class="pill warn" title="Insecure: false in every export rule">Privileged ports only</span>`);
        if (smb && !s.smb_browsable) notes.push(`<span class="hint">Not SMB-browsable</span>`);
        if (s.referral) notes.push(`<span class="hint">Referral</span>`);
        $(`[data-note="${i}"]`, d).innerHTML = notes.join(" ");
      });
      const strict = nfs ? picked.filter(s => !s.insecure_allowed).map(s => s.name) : [];
      $("#ip-reminder", d).innerHTML = strict.length ? `<div class="wlist"><li class="warn" style="list-style:none">${insecureReminder(strict)}</li></div>` : "";
      $("#ip-all", d).checked = picked.length === shares.length;
      $("#ip-go", d).disabled = !n;
      $("#ip-go", d).textContent = n ? `Add ${n} share${n > 1 ? "s" : ""}` : "Add shares";
    };
    boxes.forEach(b => b.onchange = update);
    $("#ip-all", d).onchange = e => { boxes.forEach(b => b.checked = e.target.checked); update(); };
    ["#ip-nfs", "#ip-smb"].forEach(id => $(id, d).onchange = update);
    update();
    $("#ipf", d).onsubmit = async e => {
      e.preventDefault();
      const picked = sel(), protocols = protos();
      $("#ip-go", d).disabled = true; $("#ip-go", d).textContent = $("#ip-mount", d).checked ? "Adding and mounting…" : "Adding…";
      try {
        const r = await api("/api/shares/import", {method: "POST", body: {
          server: $("#ip-server", d).value.trim(), protocols, shares: picked.map(s => ({name: s.name, path: s.path})),
          username: $("#ip-user", d).value, password: $("#ip-pass", d).value, domain: $("#ip-dom", d).value,
          mount: $("#ip-mount", d).checked, auto_mount: $("#ip-auto", d).checked}});
        const strict = protocols.includes("nfs") ? picked.filter(s => !s.insecure_allowed).map(s => s.name) : [];
        importResult(r, strict);
      } catch (err) { toast(err.message, true); update(); }
    };
  }, "min(860px,94vw)");
}

function importResult(r, strict) {
  renderShares();
  const created = r.created.length;
  if (!r.skipped.length && !r.mount_errors.length && !strict.length) { dlg.close(); toast(`Added ${created} share${created === 1 ? "" : "s"}`); return; }
  openDialog(`<div class="body"><h2>${created ? `Added ${created} share${created === 1 ? "" : "s"}` : "No shares added"}</h2><div class="stack">
    ${r.skipped.length ? `<div><h3>Skipped</h3><ul class="msgs">${r.skipped.map(x => `<li class="note">${esc(x.name)}: ${esc(x.reason)}</li>`).join("")}</ul></div>` : ""}
    ${r.mount_errors.length ? `<div><h3>Couldn't mount</h3><ul class="msgs">${r.mount_errors.map(x => `<li class="err">${esc(x.name)}: ${esc(x.error)}</li>`).join("")}</ul>
      <p class="hint" style="margin:4px 0 0">The shares were added; fix the cause and use <b>Mount</b> on the Shares page.</p></div>` : ""}
    ${strict.length && created ? `<div class="wlist"><li class="warn" style="list-style:none">${insecureReminder(strict)}</li></div>` : ""}
  </div><div class="actions"><button class="primary" data-close>Done</button></div></div>`, null, "min(760px,94vw)");
}

function shareDialog(s) {
  s = s || {kind:"nfs", auto_mount:true};
  openDialog(`<form id="sf"><h2>${s.id ? "Edit share" : "Add share"}</h2><div class="stack">
    <div><label class="f" for="s-name">Name</label><input type="text" id="s-name" value="${esc(s.name)}" required placeholder="Projects"></div>
    <div><label class="f">Connection</label><div class="seg" id="s-kind">
      ${[["nfs","NFS v3"],["smb","SMB"],["local","Already mounted"]].map(([k,l]) => `<button type="button" data-k="${k}" aria-pressed="${s.kind===k}">${l}</button>`).join("")}</div></div>
    <div id="s-fields"></div>
    <label class="check"><input type="checkbox" id="s-auto" ${s.auto_mount ? "checked" : ""}> Mount when the service starts</label>

        <div class="hint">Mount the share on the Docker host and bind-mount it under /mnt/external.</div>` : `
        <div class="grid2"><div><label class="f" for="s-server">Server</label><input type="text" id="s-server" value="${esc(s.server)}" placeholder="anvil.example.com"></div>
        <div><label class="f" for="s-export">${kind === "smb" ? "Share name" : "Export"}</label><input type="text" id="s-export" class="mono" value="${esc(s.export)}" placeholder="${kind === "smb" ? "projects" : "/projects"}"></div></div>
        ${kind === "smb" ? `<div class="grid2" style="margin-top:12px"><div><label class="f" for="s-user">Username</label><input type="text" id="s-user" value="${esc(s.username)}" autocomplete="off"></div>
        <div><label class="f" for="s-pass">Password</label><input type="password" id="s-pass" autocomplete="new-password" placeholder="${s.has_password ? "Unchanged" : ""}"></div></div>
        <div style="margin-top:12px"><label class="f" for="s-dom">Domain</label><input type="text" id="s-dom" value="${esc(s.domain)}"></div>` : ""}
        <div style="margin-top:12px"><label class="f" for="s-opts">Mount options</label><input type="text" id="s-opts" class="mono" value="${esc(s.options || "")}" placeholder="${esc(CAT.mount_defaults[kind])}">
        <div class="hint">${kind === "smb" ? "Leave blank for the default shown. If you set your own, noserverino is still added, since hstk needs it on SMB." : "Leave blank for the default shown. v3 mounts always get nolock. Keep attribute caching on: actimeo=0 or noac make hs fail with stale file handles."}</div></div>`;
    };
    fields();
    $$("#s-kind button", d).forEach(b => b.onclick = () => { kind = b.dataset.k; $$("#s-kind button", d).forEach(x => x.setAttribute("aria-pressed", x === b)); fields(); });
    $("#sf", d).onsubmit = async e => {
      e.preventDefault();
      const v = id => $(id, d)?.value?.trim();

      await act(() => s.id ? api(`/api/shares/${s.id}`, {method:"PUT", body}) : api("/api/shares", {method:"POST", body}), s.id ? "Share saved" : "Share added");
      dlg.close(); renderShares();
    };
  });
}

// ---------------------------------------------------------------- reports list
async function renderReports() {
  const [defs, shares, runs] = await Promise.all([api("/api/definitions"), api("/api/shares"), api("/api/runs?limit=500")]);
  const shareName = Object.fromEntries(shares.map(s => [s.id, s.name]));
  const lastRun = {}; runs.forEach(r => { if (r.definition_id && !lastRun[r.definition_id]) lastRun[r.definition_id] = r; });
  const kind = d => d.mode === "sum" ? "Summary" : d.mode === "eval" ? (d.eval?.source === "system" ? "System query" : "File listing") : "Custom";
  view.innerHTML = `
  <header class="page"><div><h1>Reports</h1><p class="sub">Saved report designs. Run one now, or schedule it from the Schedules page.</p></div>
    ${newReportMenu()}</header>
  <div class="panel">${defs.length ? `<div class="scroll"><table class="data"><thead><tr><th>Report</th><th>Type</th><th>Share and paths</th><th>Last run</th><th></th></tr></thead><tbody>
    ${defs.map(d => { const r = lastRun[d.id]; return `<tr>
      <td><a href="#/design/${d.id}"><b>${esc(d.name)}</b></a>${d.description ? `<div class="hint">${esc(d.description)}</div>` : ""}</td>
      <td>${kind(d)}</td>
      <td>${esc(shareName[d.share_id] || "Missing share")} <span class="mono">${(d.paths||[]).map(esc).join(", ")}</span></td>
      <td>${r ? `<a href="#/run/${r.id}">${statusPill(r.status)}</a> <span class="hint">${when(r.started)}</span>` : `<span class="hint">Never</span>`}</td>
      <td><div class="row" style="justify-content:flex-end"><button class="primary" data-run="${d.id}">Run</button>
        <a class="btn ghost" href="#/design/${d.id}">Edit</a><a class="btn ghost" href="#/schedules?new=${d.id}">Schedule</a><button class="ghost danger" data-del="${d.id}">Delete</button></div></td></tr>`; }).join("")}
  </tbody></table></div>` : `<div class="empty"><p>${shares.length ? "No reports yet. Design one to see capacity by owner, file type, volume and more." : "Add a share first, then design a report against it."}</p>
    <a class="btn primary" href="${shares.length ? "#/design" : "#/shares"}">${shares.length ? "New report" : "Add a share"}</a></div>`}</div>`;
  $$("[data-run]").forEach(b => b.onclick = async () => { const r = await act(() => api(`/api/definitions/${b.dataset.run}/run`, {method:"POST"})); location.hash = `#/run/${r.run_id}`; });
  $$("[data-del]").forEach(b => b.onclick = async () => { if (!confirm("Delete this report? Its past results are kept.")) return;

function newReportMenu() {

    ${CAT.presets.map(p => `<a href="#/design?preset=${p.id}">${esc(p.label)}</a>`).join("")}

    <a href="#/design">Blank report</a>
  </div></details>`;
}

// ---------------------------------------------------------------- designer
const BLANK = () => ({name:"", description:"", share_id:"", paths:["/"], mode:"sum",
  sum:{group_by:["owner"], metrics:["file_count","space_used","top_files"], top_n:10},
  eval:{source:"fields", fields:["dpath","owner","space_used"], recursive:true, files_only:true, system_query:"storage_volumes"},
  filters:{}, custom_expression:"", custom_columns:"", custom_verb:"sum", nonfiles:false,
  folders:{enabled:false, depth:1, include_hidden:false},
  display:{fields:[], sort_by:"", sort_desc:true, limit:null, size_unit:"auto"}});

async function renderDesigner(id) {
  const [shares, existing] = await Promise.all([api("/api/shares"), id ? api(`/api/definitions/${id}`) : null]);
  const base = BLANK();
  const D = existing ? {...base, ...clone(existing), sum:{...base.sum, ...(existing.sum||{})}, eval:{...base.eval, ...(existing.eval||{})},
      filters:{...(existing.filters||{})}, folders:{...base.folders, ...(existing.folders||{})},
      display:{...base.display, ...(existing.display||{})}} : base;
  if (!D.share_id && shares.length) D.share_id = shares[0].id;

  view.innerHTML = `
  <header class="page"><div><h1>${existing ? esc(existing.name) : "New report"}</h1><p class="sub">Choose where to look, what to group by and which fields to show. The query panel shows the exact hs command that will run.</p></div>
    <div class="row"><a class="btn" href="#/reports">Cancel</a><button id="run-now">Run without saving</button><button class="primary" id="save">Save report</button></div></header>
  <div class="designer">
    <div class="stack">
      <section class="panel stack">
        <div class="grid2"><div><label class="f" for="d-name">Report name</label><input type="text" id="d-name" value="${esc(D.name)}" placeholder="Capacity by owner"></div>
          <div><label class="f" for="d-preset">Start from</label><select id="d-preset"><option value="">Choose a starting point…</option>
            ${CAT.presets.map(p => `<option value="${p.id}">${esc(p.label)}</option>`).join("")}
            <option value="__custom">Custom expression</option></select></div></div>
        <div><label class="f" for="d-desc">Description</label><input type="text" id="d-desc" value="${esc(D.description)}" placeholder="Optional"></div>
      </section>
      <section class="panel stack"><h2>Where</h2>
        ${shares.length ? `<div><label class="f" for="d-share">Share</label><select id="d-share">${shares.map(s => `<option value="${s.id}" ${s.id===D.share_id?"selected":""}>${esc(s.name)}${s.status.mounted ? "" : " (not mounted)"}</option>`).join("")}</select></div>
        <div><label class="f" for="d-addpath">Folders to scan</label><div class="chips" id="d-paths" style="margin-bottom:8px"></div>
          <div class="row" style="flex-wrap:nowrap"><input type="text" id="d-addpath" class="mono" placeholder="/projects/2026" style="flex:1">
            <button type="button" id="d-addpath-btn">Add</button><button type="button" id="d-browse">Browse…</button></div>
          <div class="hint">Scan the whole share with /, or one or more subfolders. Each folder is scanned separately; with more than one, results get a Path column.</div></div>` :
          `<p class="errbox">No shares configured. <a href="#/shares">Add a share</a> first.</p>`}
      </section>
      <section class="panel stack"><h2>What</h2>
        <div class="seg" id="d-type">${[["summary","Summary"],["listing","File listing"],["system","System query"],["custom","Custom expression"]].map(([k,l]) => `<button type="button" data-t="${k}">${l}</button>`).join("")}</div>
        <div id="d-type-body" class="stack"></div>
      </section>
      <section class="panel stack" id="d-filters-panel"><h2>Filters</h2><div id="d-filters"></div></section>
      <p class="hint" id="d-speed-note"></p>
    </div>
    <aside class="sticky stack">
      <section class="query"><div class="qhead"><h3>HammerScript</h3><span class="qtag" id="q-tag" hidden>Edited</span><span class="spacer"></span>
          <button class="qbtn" id="q-reset" hidden>Reset to generated</button></div>
        <div id="q-edit"></div>
        <p class="qnote" id="q-note" aria-live="polite"></p>
        <h3>Command</h3><div id="q-cmd" aria-live="polite"></div></section>
      <section class="panel"><h2>Output fields</h2><p class="hint" style="margin:-4px 0 10px">Tick the columns to show and use the arrows to order them. Applies to results and CSV exports.</p>
        <ul class="fields" id="q-fields"></ul>
        <div class="grid2" style="margin-top:14px"><div><label class="f" for="q-sort">Sort by</label><select id="q-sort"></select></div>
          <div><label class="f" for="q-dir">Order</label><select id="q-dir"><option value="1">Largest first</option><option value="0">Smallest first</option></select></div></div>
        <div style="margin-top:12px"><label class="f" for="q-unit">Show sizes in</label><select id="q-unit">
          ${[["auto","Auto (best unit per value)"],["bytes","Bytes"],["kb","KB"],["mb","MB"],["gb","GB"],["tb","TB"]].map(([v,l]) => `<option value="${v}" ${D.display.size_unit===v?"selected":""}>${l}</option>`).join("")}</select>
          <div class="hint">One unit for every size in the results and CSV downloads. hs always returns exact bytes (SPACE_USED/bytes); 1 KB = 1,000 bytes.</div></div>
        <div style="margin-top:12px"><label class="f" for="q-limit">Row limit</label><input type="number" id="q-limit" min="1" placeholder="All rows" value="${esc(D.display.limit || "")}"></div>
      </section>
    </aside>
  </div>`;

  // --- static bindings
  const bindVal = (sel, fn) => { const el = $(sel); if (el) el.addEventListener("input", () => { fn(el.value); refresh(); }); };
  bindVal("#d-name", v => D.name = v);
  bindVal("#d-desc", v => D.description = v);
  bindVal("#d-share", v => { D.share_id = v; });
  function applyPreset(pid) {
    if (pid === "__custom") { uiType = "custom"; D.mode = "custom"; drawType(); drawFilters(); refresh(); return; }
    const p = CAT.presets.find(x => x.id === pid); if (!p) return;
    D.expression_override = null; editor.set("");
    D.mode = p.mode; if (p.sum) D.sum = {...D.sum, ...clone(p.sum)}; if (p.eval) D.eval = {...D.eval, ...clone(p.eval)};

  const drawPaths = () => {

  };
  drawPaths();
  const addPath = p => {
    p = "/" + p.trim().replace(/^\/+|\/+$/g, "");
    if (D.paths.length === 1 && D.paths[0] === "/" && p !== "/") D.paths = [p]; else if (!D.paths.includes(p)) D.paths.push(p);
    drawPaths(); refresh();
  };
  $("#d-browse") && ($("#d-browse").onclick = () => browseDialog(D.share_id, addPath));
  const typed = async () => {
    const el = $("#d-addpath"), p = el.value.trim(); if (!p) return;
    const share = shares.find(x => x.id === D.share_id);
    if (share?.status.mounted) {
      try { await api(`/api/shares/${D.share_id}/browse?path=${encodeURIComponent(p)}`); }
      catch (e) { toast(`${p}: ${e.message}`, true); return; }
    }
    addPath(p); el.value = "";
  };
  $("#d-addpath-btn") && ($("#d-addpath-btn").onclick = typed);
  $("#d-addpath") && ($("#d-addpath").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); typed(); } });

  // --- report type
  $$("#d-type button").forEach(b => b.onclick = () => { uiType = b.dataset.t; D.expression_override = null; editor.set(""); drawType(); drawFilters(); refresh(); });
  function drawType() {
    $$("#d-type button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === uiType));
    D.mode = uiType === "summary" ? "sum" : uiType === "custom" ? "custom" : "eval";
    if (uiType !== "summary") D.folders.enabled = false;
    if (uiType === "listing") D.eval.source = "fields";
    if (uiType === "system") D.eval.source = "system";
    const body = $("#d-type-body");
    if (uiType === "summary") {
      const rowSel = D.sum.group_by.find(g => CAT.row_groups[g]);
      body.innerHTML = `<p class="hint" style="margin:0">Runs <code>hs sum</code>: one fast pass over every file under each path, totalled into groups.</p>
        <div><h3>Group by</h3><div class="checks">
          ${Object.entries(CAT.group_keys).map(([k,v]) => `<label class="check"><input type="checkbox" name="g" value="${k}" ${D.sum.group_by.includes(k)?"checked":""}>${esc(v.label)}</label>`).join("")}
          ${Object.entries(CAT.row_groups).map(([k,v]) => `<label class="check"><input type="checkbox" name="g" value="${k}" ${D.sum.group_by.includes(k)?"checked":""}>${esc(v.label)}</label>`).join("")}
        </div><div class="hint">Leave all unticked for a single total. Storage volume combines with owner, group and the others; active objective is used on its own.</div></div>
        <div><h3>Metrics</h3><div class="checks">
          ${Object.entries(CAT.metrics).map(([k,v]) => `<label class="check"><input type="checkbox" name="m" value="${k}" ${D.sum.metrics.includes(k)?"checked":""}>${esc(v.label)}</label>`).join("")}
        </div></div>
        <div style="max-width:220px"><label class="f" for="d-topn">Largest files per group</label><select id="d-topn" ${D.sum.metrics.includes("top_files")?"":"disabled"}>${CAT.top_n_choices.map(n => `<option ${+D.sum.top_n===n?"selected":""}>${n}</option>`).join("")}</select></div>
        <div><h3>Break down by folder</h3>
          <label class="check"><input type="checkbox" id="d-pf" ${D.folders.enabled?"checked":""}>Report each folder separately</label>
          <div class="row" style="margin:6px 0 0 24px;gap:16px" ${D.folders.enabled?"":"hidden"} id="d-pf-opts">
            <label class="row" style="gap:8px;font-size:14px">Levels below each folder to scan
              <select id="d-pf-depth" style="width:auto">${CAT.folder_depths.map(x => `<option value="${x}" ${String(D.folders.depth)===String(x)?"selected":""}>${x === "all" ? "All levels" : x}</option>`).join("")}</select></label>
            <label class="check"><input type="checkbox" id="d-pf-hidden" ${D.folders.include_hidden?"checked":""}>Include hidden folders</label></div>
          <div class="hint">Runs hs sum once per folder, in parallel. Each folder's totals include everything below it. The folder you picked is included as the first row.</div></div>`;
      $$("input[name=g]", body).forEach(cb => cb.onchange = () => {
        const v = cb.value;
        if (cb.checked) D.sum.group_by = v === "objective" ? [v] : [...D.sum.group_by.filter(g => g !== "objective"), v];
        else D.sum.group_by = D.sum.group_by.filter(g => g !== v);
        drawType(); refresh(); });
      $$("input[name=m]", body).forEach(cb => cb.onchange = () => {
        D.sum.metrics = $$("input[name=m]:checked", body).map(x => x.value); drawType(); refresh(); });
      $("#d-topn", body).onchange = e => { D.sum.top_n = +e.target.value; refresh(); };
      $("#d-pf", body).onchange = e => { D.folders.enabled = e.target.checked; $("#d-pf-opts", body).hidden = !e.target.checked; D.display.fields = []; refresh(); };
      $("#d-pf-depth", body).onchange = e => { D.folders.depth = e.target.value === "all" ? "all" : +e.target.value; refresh(); };
      $("#d-pf-hidden", body).onchange = e => { D.folders.include_hidden = e.target.checked; refresh(); };
    } else if (uiType === "listing") {
      body.innerHTML = `<p class="hint" style="margin:0">Runs <code>hs eval</code> and returns one row per file. Large trees produce large results; add filters to narrow it.</p>
        <div><h3>Fields per file</h3><div class="checks">${Object.entries(CAT.eval_fields).map(([k,v]) => `<label class="check"><input type="checkbox" name="ef" value="${k}" ${D.eval.fields.includes(k)?"checked":""}>${esc(v.label)}</label>`).join("")}</div></div>
        <label class="check"><input type="checkbox" id="d-rec" ${D.eval.recursive?"checked":""}>Include everything below each path (-r)</label>
        <label class="check"><input type="checkbox" id="d-fo" ${D.eval.files_only!==false?"checked":""}>Files only (skip directories)</label>`;
      $$("input[name=ef]", body).forEach(cb => cb.onchange = () => {
        const on = cb.checked, v = cb.value;
        D.eval.fields = on ? [...D.eval.fields, v] : D.eval.fields.filter(f => f !== v); refresh(); });
      $("#d-rec", body).onchange = e => { D.eval.recursive = e.target.checked; refresh(); };
      $("#d-fo", body).onchange = e => { D.eval.files_only = e.target.checked; refresh(); };
    } else if (uiType === "system") {
      body.innerHTML = `<p class="hint" style="margin:0">Runs <code>hs eval</code> once against the share to read cluster-level information.</p>
        <div style="max-width:320px"><label class="f" for="d-sys">Query</label><select id="d-sys">${Object.entries(CAT.system_queries).map(([k,v]) => `<option value="${k}" ${D.eval.system_query===k?"selected":""}>${esc(v.label)}</option>`).join("")}</select></div>`;
      $("#d-sys", body).onchange = e => { D.eval.system_query = e.target.value; D.display.fields = []; refresh(); };
    } else {
      body.innerHTML = `<div class="row"><label class="f" style="margin:0">Command</label><div class="seg" id="d-verb">${["sum","eval"].map(v => `<button type="button" data-v="${v}" aria-pressed="${D.custom_verb===v}">hs ${v}</button>`).join("")}</div></div>
        <div><label class="f" for="d-exp">Expression</label><textarea id="d-exp" spellcheck="false" placeholder="IS_FILE?SUMS_TABLE{|KEY=OWNER,|VALUE={1FILE,SPACE_USED}}">${esc(D.custom_expression)}</textarea></div>
        <div><label class="f" for="d-cols">Column names</label><input type="text" id="d-cols" value="${esc(D.custom_columns)}" placeholder="Files, Space used">
          <div class="hint">Comma-separated names for each value in a returned tuple, in order. Leave blank to use the raw structure.</div></div>`;
      $$("#d-verb button", body).forEach(b => b.onclick = () => { D.custom_verb = b.dataset.v; $$("#d-verb button", body).forEach(x => x.setAttribute("aria-pressed", x === b)); refresh(); });
      bindVal("#d-exp", v => D.custom_expression = v);
      bindVal("#d-cols", v => D.custom_columns = v);
    }
  }

  // --- filters
  const SIZE_U = [["KB",1e3],["MB",1e6],["GB",1e9],["TB",1e12]];
  const splitSize = b => { if (!b && b !== 0) return ["", "GB"]; for (const [u, m] of [...SIZE_U].reverse()) if (b % m === 0) return [b / m, u]; return [b / 1000, "KB"]; };
  function drawFilters() {
    const panel = $("#d-filters-panel");
    panel.hidden = uiType === "system" || uiType === "custom";
    if (panel.hidden) return;
    const F = D.filters, [mn, mnu] = splitSize(F.min_size), [mx, mxu] = splitSize(F.max_size);
    const sizeIn = (id, v, u) => `<div class="row" style="flex-wrap:nowrap"><input type="number" min="0" step="any" id="${id}" value="${esc(v)}" style="flex:1"><select id="${id}-u" style="width:84px">${SIZE_U.map(([x]) => `<option ${x===u?"selected":""}>${x}</option>`).join("")}</select></div>`;
    $("#d-filters").innerHTML = `<div class="stack">
      <div class="grid2"><div><label class="f" for="f-min">Minimum space used</label>${sizeIn("f-min", mn, mnu)}</div>
        <div><label class="f" for="f-max">Maximum space used</label>${sizeIn("f-max", mx, mxu)}</div></div>
      <div class="checks"><label class="check"><input type="checkbox" id="f-open" ${F.only_open?"checked":""}>Open files only</label>
        <label class="check"><input type="checkbox" id="f-online" ${F.only_online?"checked":""}>Online files only</label>
        <label class="check"><input type="checkbox" id="f-err" ${F.only_errors?"checked":""}>Files with errors only</label>
        <label class="check"><input type="checkbox" id="f-nonfiles" ${D.nonfiles?"checked":""}>Include non-files (--nonfiles)</label></div>
      <div style="max-width:280px"><label class="f" for="f-age">Not accessed for at least</label>
        <div class="row" style="flex-wrap:nowrap"><input type="number" min="0" id="f-age" value="${esc(F.access_age_days || "")}" placeholder="Any" style="flex:1"><span>days</span></div>
        <div class="hint">Uses Hammerspace's ACCESS_AGE.</div></div>
      <div><label class="f" for="f-cond">Extra condition</label><input type="text" id="f-cond" class="mono" value="${esc(F.custom_condition)}" placeholder='OWNER!="root"'>
        <div class="hint">Any HammerScript condition. Files that don't match are skipped.</div></div></div>`;
    const sizeVal = id => { const v = $(`#${id}`).value; if (v === "") return null; return Math.round(parseFloat(v) * SIZE_U.find(([u]) => u === $(`#${id}-u`).value)[1]); };
    ["f-min","f-min-u","f-max","f-max-u"].forEach(id => $("#" + id).addEventListener("input", () => { F.min_size = sizeVal("f-min"); F.max_size = sizeVal("f-max"); refresh(); }));
    $("#f-open").onchange = e => { F.only_open = e.target.checked; refresh(); };
    $("#f-online").onchange = e => { F.only_online = e.target.checked; refresh(); };
    $("#f-err").onchange = e => { F.only_errors = e.target.checked; refresh(); };
    $("#f-age").oninput = e => { F.access_age_days = e.target.value ? +e.target.value : null; refresh(); };
    $("#f-nonfiles").onchange = e => { D.nonfiles = e.target.checked; refresh(); };
    bindVal("#f-cond", v => F.custom_condition = v);
  }

  // --- output fields
  function drawFields(cols) {
    const disp = D.display;
    let chosen = (disp.fields || []).filter(c => cols.includes(c));
    if (!disp.fields?.length) chosen = [...cols];
    const order = [...chosen, ...cols.filter(c => !chosen.includes(c))];
    const ul = $("#q-fields");
    ul.innerHTML = cols.length ? order.map((c, i) => { const on = chosen.includes(c); return `<li class="${on?"":"off"}">
      <input type="checkbox" aria-label="Show ${esc(c)}" data-c="${esc(c)}" ${on?"checked":""} style="accent-color:var(--accent)">
      <span class="fname">${esc(c)}</span>
      <button class="ghost" data-up="${i}" aria-label="Move ${esc(c)} up" ${i===0||!on?"disabled":""}>↑</button>
      <button class="ghost" data-down="${i}" aria-label="Move ${esc(c)} down" ${!on||i>=chosen.length-1?"disabled":""}>↓</button></li>`; }).join("")
      : `<li class="hint">Columns appear here once the report is valid. Custom expressions without column names show whatever structure Hammerspace returns.</li>`;
    const commit = list => { disp.fields = list.length === cols.length && list.every((c, i) => c === cols[i]) ? [] : list; drawFields(cols); };
    $$("input[data-c]", ul).forEach(cb => cb.onchange = () => {
      const c = cb.dataset.c; let list = [...chosen];
      if (cb.checked) list.push(c); else { list = list.filter(x => x !== c); if (!list.length) { toast("Keep at least one field", true); cb.checked = true; return; } }
      commit(list); });
    $$("[data-up]", ul).forEach(b => b.onclick = () => { const i = +b.dataset.up, l = [...chosen]; [l[i-1], l[i]] = [l[i], l[i-1]]; commit(l); });
    $$("[data-down]", ul).forEach(b => b.onclick = () => { const i = +b.dataset.down, l = [...chosen]; [l[i+1], l[i]] = [l[i], l[i+1]]; commit(l); });
    const sort = $("#q-sort");
    sort.innerHTML = `<option value="">As returned</option>` + cols.map(c => `<option ${disp.sort_by===c?"selected":""}>${esc(c)}</option>`).join("");
  }
  $("#q-sort").onchange = e => D.display.sort_by = e.target.value;
  $("#q-dir").value = D.display.sort_desc === false ? "0" : "1";
  $("#q-dir").onchange = e => D.display.sort_desc = e.target.value === "1";
  $("#q-limit").oninput = e => D.display.limit = e.target.value ? +e.target.value : null;
  $("#q-unit").onchange = e => D.display.size_unit = e.target.value;

  // --- editable expression
  let lastGenerated = null;
  const editor = codeEditor($("#q-edit"), {
    onInput: v => {
      if (D.mode === "custom") { D.custom_expression = v; const ta = $("#d-exp"); if (ta && ta.value !== v) ta.value = v; }
      else D.expression_override = (v.trim().replace(/\s+/g, " ") === lastGenerated || !v.trim()) ? null : v;
      refresh();
    },
    onRun: () => $("#run-now").click(),
  });
  $("#q-reset").onclick = () => { D.expression_override = null; editor.set(""); refresh(); };

  // --- live preview
  let t = null;
  function refresh() { clearTimeout(t); t = setTimeout(doPreview, 180); }
  async function doPreview() {
    const seq = ++previewSeq;
    try {
      const p = await api("/api/preview", {method:"POST", body:D});
      if (seq !== previewSeq) return;
      lastPreview = p;
      lastGenerated = p.generated_expression;
      if (!editor.focused()) editor.set(p.expression);
      $("#q-tag").hidden = !p.edited; $("#q-reset").hidden = !p.edited;
      const note = $("#q-note"); note.classList.remove("err");
      note.textContent = p.edited ? "Edited by hand. Changing the report options won't change it until you reset to the generated expression."
        : "Edit the expression directly to fine-tune it. Ctrl+Enter runs it.";
      $("#q-cmd").innerHTML = p.commands.map(c => c.startsWith("#") ? `<p class="cmd" style="color:#A9BBD6;font-family:var(--sans)">${esc(c.slice(2))}</p>` : `<p class="cmd">$ ${esc(c)}</p>`).join("");
      drawFields(p.columns);
    } catch (e) {
      if (seq !== previewSeq) return;
      lastPreview = null;
      const note = $("#q-note"); note.textContent = e.message; note.classList.add("err"); $("#q-cmd").innerHTML = "";
      drawFields([]);
    }
  }

  // --- crawl speed
  function drawSpeed() {
    $("#d-speed-note").innerHTML = crawlNote(CAT.crawl, CAT.max_hs_processes);
  }

  drawType(); drawFilters(); drawSpeed();
  const pre = new URLSearchParams(location.hash.split("?")[1] || "").get("preset");
  if (pre && !existing) applyPreset(pre); else doPreview();

  $("#save").onclick = async () => {
    if (!D.name.trim()) { toast("Give the report a name", true); $("#d-name").focus(); return; }
    const saved = await act(() => existing ? api(`/api/definitions/${existing.id}`, {method:"PUT", body:D}) : api("/api/definitions", {method:"POST", body:D}), "Report saved");
    if (!existing) location.hash = `#/design/${saved.id}`; else route();
  };
  $("#run-now").onclick = async () => {
    const r = await act(() => api("/api/run", {method:"POST", body:{...D, name: D.name || "Unsaved report"}}));
    location.hash = `#/run/${r.run_id}`;
  };
}

function browseDialog(shareId, onPick) {
  let cur = "/";
  openDialog(`<div class="body"><h2>Add a folder</h2><div class="crumbs" id="b-crumbs"></div><div class="dirlist" id="b-list"><p class="empty">Loading…</p></div>
    <div class="actions"><button data-close>Cancel</button><button class="primary" id="b-pick">Add this folder</button></div></div>`, d => {
    const load = async path => {
      try {
        const r = await api(`/api/shares/${shareId}/browse?path=${encodeURIComponent(path)}`); cur = r.path;
        const parts = cur.split("/").filter(Boolean);
        $("#b-crumbs", d).innerHTML = `<button data-p="/">share</button>` + parts.map((p, i) => `/<button data-p="/${parts.slice(0, i+1).map(esc).join("/")}">${esc(p)}</button>`).join("");
        $("#b-list", d).innerHTML = (cur !== "/" ? `<button data-p="${esc("/" + parts.slice(0, -1).join("/"))}">..</button>` : "") +
          (r.dirs.map(x => `<button data-p="${esc((cur === "/" ? "" : cur) + "/" + x)}">${esc(x)}/</button>`).join("") || `<p class="hint" style="padding:10px 12px;margin:0">No subfolders.</p>`) +
          (r.truncated ? `<p class="hint" style="padding:8px 12px">Showing the first 500 folders.</p>` : "");
        $$("[data-p]", d).forEach(b => b.onclick = () => load(b.dataset.p));
        $("#b-pick", d).textContent = `Add ${cur}`;
      } catch (e) { $("#b-list", d).innerHTML = `<div class="errbox" style="margin:10px">${esc(e.message)}</div>`; }
    };
    load("/");
    $("#b-pick", d).onclick = () => { onPick(cur); dlg.close(); };
  });
}

// ---------------------------------------------------------------- runs
async function renderRuns() {
  const runs = await api("/api/runs");
  view.innerHTML = `<header class="page"><div><h1>Results</h1><p class="sub">Every report run, newest first. Scheduled runs are pruned to each schedule's retention setting.</p></div></header>
  <div class="panel">${runs.length ? `<div class="scroll"><table class="data"><thead><tr><th>Report</th><th>Share</th><th>Started</th><th>Took</th><th>How</th><th class="num">Rows</th><th>Status</th><th></th></tr></thead><tbody>
    ${runs.map(r => `<tr><td><a href="#/run/${r.id}"><b>${esc(r.name)}</b></a></td><td>${esc(r.share_name || "")}</td><td>${when(r.started)}</td>
      <td>${dur(r.started, r.finished)}</td><td>${esc(r.trigger)}</td><td class="num">${num(r.row_count)}</td><td>${statusPill(r.status)}</td>
      <td><button class="ghost danger" data-del="${r.id}">Delete</button></td></tr>`).join("")}
  </tbody></table></div>` : `<div class="empty"><p>No results yet. Run a report to see it here.</p><a class="btn primary" href="#/reports">Go to reports</a></div>`}</div>`;
  $$("[data-del]").forEach(b => b.onclick = async () => { await act(() => api(`/api/runs/${b.dataset.del}`, {method:"DELETE"})); renderRuns(); });
  if (runs.some(r => ["queued","running"].includes(r.status))) pollTimer = setTimeout(() => location.hash.startsWith("#/runs") && renderRuns(), 3000);
}

async function renderRun(id) {
  let override = null; // ad hoc column/sort choices on this page
  let pendingExp = null; // edited HammerScript, kept across redraws
  async function load() {
    const q = new URLSearchParams();
    if (override) { q.set("fields", override.fields.join(",")); q.set("sort_by", override.sort_by || ""); q.set("sort_desc", override.sort_desc); q.set("size_unit", override.size_unit || "auto"); }
    const r = await api(`/api/runs/${id}?${q}`);
    draw(r);
    if (["queued","running"].includes(r.status)) pollTimer = setTimeout(() => location.hash === `#/run/${id}` && load(), 2500);
  }
  function draw(r) {
    const v = r.view, meta = r.column_meta || {}, unit = v.display.size_unit || "auto";
    const hasSizes = v.available.some(c => meta[c]?.unit === "bytes") || r.has_files;
    const head = c => meta[c]?.unit === "bytes" && unit !== "auto" ? `${c} (${UNIT_L[unit]})` : c;
    const isBytes = c => meta[c]?.unit === "bytes", isNum = c => meta[c]?.numeric || v.rows.some(x => typeof x[c] === "number");
    const sortCol = v.display.sort_by, barCol = (sortCol && isNum(sortCol)) ? sortCol : v.columns.find(isBytes);
    const max = barCol ? Math.max(1, ...v.rows.map(x => typeof x[barCol] === "number" ? x[barCol] : 0)) : 1;
    const cell = (c, x) => {
      const val = x[c];
      if (Array.isArray(val) && val.length && val[0] && "path" in val[0]) return `<details class="top"><summary>${val.length} ${val.length === 1 ? "file" : "files"}</summary><ol>${val.map(f => `<li><span class="mono">${esc(f.path)}</span> <span class="hint">${bytes(f.space_used, unit)}${unit !== "auto" ? " " + UNIT_L[unit] : ""}</span></li>`).join("")}</ol></details>`;
      if (val !== null && typeof val === "object") return `<span class="mono">${esc(JSON.stringify(val))}</span>`;
      const txt = isBytes(c) ? bytes(val, unit) : typeof val === "number" ? num(val) : esc(val);
      if (c === barCol && typeof val === "number" && val > 0) return `<div class="bar"><i style="width:${(val/max*100).toFixed(1)}%"></i><span>${txt}</span></div>`;
      return c === "Path" || c === "Folder" || /path/i.test(c) ? `<span class="mono">${txt}</span>` : txt;
    };
    const qs = new URLSearchParams({fields: v.columns.join(","), sort_by: v.display.sort_by || "", sort_desc: v.display.sort_desc !== false, size_unit: unit});
    view.innerHTML = `
    <header class="page"><div><h1>${esc(r.name)}</h1>
      <div class="meta" style="margin-top:8px">${statusPill(r.status)}<span>Share <b>${esc(r.share_name || "—")}</b></span><span>Started <b>${when(r.started)}</b></span>
      ${r.finished ? `<span>Took <b>${dur(r.started, r.finished)}</b></span>` : ""}<span><b>${num(r.row_count)}</b> rows</span><span>${esc(r.trigger)}</span></div></div>
      <div class="row">${r.definition_id ? `<a class="btn" href="#/design/${r.definition_id}">Edit report</a><button id="rerun">Run again</button>` : ""}
        <details class="menu"><summary class="btn primary">Download</summary><div class="menu-pop">
          <a href="#" id="dl-analysis"><b>Analysis CSV…</b><span>Plain values for sorting in a spreadsheet. Choose units and columns${r.has_files ? "; largest files as their own CSV" : ""}</span></a>
          <a href="/api/runs/${id}/export?format=csv&${qs}"><b>Table as shown</b><span>The columns, order and sort on screen</span></a>
          <a href="/api/runs/${id}/export?format=json&${qs}"><b>JSON</b><span>Table as shown, as JSON</span></a>
          ${r.has_folders ? `<a href="/api/runs/${id}/export?format=prometheus"><b>Prometheus metrics</b><span>Per-folder size and file count</span></a>` : ""}
          <a href="/api/runs/${id}/export?format=raw"><b>Raw hs output</b><span>Exactly what Hammerspace returned</span></a>
        </div></details></div></header>
    ${r.error ? `<div class="errbox" style="margin-bottom:14px">${esc(r.error)}</div>` : ""}
    ${["queued","running"].includes(r.status) ? `<div class="panel empty"><p>${r.status === "queued" ? "Waiting for a free slot…" : (r.phase === "listing" ? `Listing folders${r.folders_found ? ` (${num(r.folders_found)} found so far)` : ""}. `
          : r.target_count > 1 ? `Scanned ${num(r.targets_done || 0)} of ${num(r.target_count)} folders. ` : "hs is walking the file tree. ")
          + (r.throttle && r.throttle.preset !== "normal" ? `Crawl speed: ${esc(r.throttle.preset)} (<a href="#/settings">Settings</a>). ` : "") + "Large shares can take a while; this page updates on its own."}</p></div>` : `
    <section class="panel">
      ${v.available.length ? `<div class="toolbar"><span class="hint">Fields</span><div class="colpick">${v.available.map(c => `<button data-col="${esc(c)}" aria-pressed="${v.columns.includes(c)}">${esc(c)}</button>`).join("")}</div>
        <span class="spacer"></span>
        ${hasSizes ? `<label class="row" style="gap:6px;font-size:13px;color:var(--ink-2)">Sizes in <select id="r-unit" style="width:auto;padding:4px 8px">
          ${[["auto","Auto"],["bytes","Bytes"],["kb","KB"],["mb","MB"],["gb","GB"],["tb","TB"]].map(([x,l]) => `<option value="${x}" ${unit===x?"selected":""}>${l}</option>`).join("")}</select></label>` : ""}
        ${r.definition_id ? `<button class="ghost" id="save-disp">Save as report default</button>` : ""}</div>` : ""}
      ${v.rows.length ? `<div class="scroll" style="max-height:70vh"><table class="data"><thead><tr>${v.columns.map(c => `<th class="sortable ${isNum(c)?"num":""}" data-sort="${esc(c)}" aria-sort="${v.display.sort_by===c ? (v.display.sort_desc!==false?"descending":"ascending") : "none"}">${esc(head(c))}${v.display.sort_by===c ? (v.display.sort_desc!==false?" ↓":" ↑") : ""}</th>`).join("")}</tr></thead>
        <tbody>${v.rows.map(x => `<tr>${v.columns.map(c => `<td class="${isNum(c) && !Array.isArray(x[c]) ? "num" : ""}">${cell(c, x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
        : `<div class="empty"><p>${r.status === "failed" ? "The report failed before returning rows. Check the command output below." : "No files matched."}</p></div>`}
    </section>`}
    <section class="panel" style="margin-top:16px"><h2>What ran</h2>
      ${r.expression ? (["queued","running"].includes(r.status) ? `<div class="query" style="margin-bottom:12px"><pre>${highlight(r.expression)}</pre></div>` : `
      <div class="query" style="margin-bottom:12px">
        <div class="qhead"><h3>HammerScript</h3>${String(r.trigger || "").includes("edited") ? `<span class="qtag">Edited</span>` : ""}<span class="spacer"></span>
          <button class="qbtn" id="w-revert" hidden>Undo changes</button></div>
        <div id="w-edit"></div>
        <p class="qnote" id="w-note" aria-live="polite">Edit the expression and run it again. Ctrl+Enter runs it.</p>
        <h3>Command</h3><div id="w-cmd" aria-live="polite">${(r.outputs || []).slice(0, 1).map(o => `<p class="cmd">$ ${esc(o.command)}</p>`).join("")}</div>
        <div class="row" style="margin-top:10px"><button class="primary" id="w-run">Run again</button>
          ${r.definition_id ? `<button id="w-save" disabled>Save to report</button>` : ""}</div>
      </div>`) : ""}
      ${r.outputs_total ? `<p class="hint">Showing the first ${r.outputs.length} of ${num(r.outputs_total)} hs runs. Download the raw output for all of them.</p>` : ""}
      ${(r.outputs || []).map(o => `<details><summary><span class="mono">${esc(o.folder || o.path)}</span> exit ${o.rc} in ${o.seconds}s${o.truncated ? " (output truncated)" : ""}</summary>
        <pre class="raw">$ ${esc(o.command)}\n\n${esc(o.stdout.slice(0, 200000)) || "(no output)"}${o.stderr ? "\n\n--- stderr ---\n" + esc(o.stderr) : ""}</pre></details>`).join("") || `<p class="hint">Nothing has run yet.</p>`}

  await load();
}

function parseCsv(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (ch !== "\r") cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

    ${plans.map(p => `<tr><td><a href="#/plan/${p.id}"><b>${esc(p.name)}</b></a></td><td>${esc(p.share_name || "Missing share")} <span class="mono">${esc(p.root)}</span></td>
      <td class="num">${p.rows}</td><td>${p.scan.status ? statusPill(p.scan.status) + ` <span class="hint">${p.scan.files != null ? num(p.scan.files) + " files" : ""}</span>` : `<span class="hint">Not scanned</span>`}</td>
